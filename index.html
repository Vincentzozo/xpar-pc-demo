<header class="top"><div class="brand"><i class="appicon" aria-hidden="true">X</i><span id="windowTitle">XPAR Sensor Utility</span></div><div class="spacer"></div><div class="language-switch" role="group" aria-label="语言 / Language" data-no-i18n><button type="button" data-language="zh" lang="zh-CN" aria-pressed="true" title="切换中文">中文</button><button type="button" data-language="en" lang="en" aria-pressed="false" title="Switch to English">EN</button></div><span class="demo">完全版</span><button type="button" class="xp-source-toggle" onclick="xpToggle()" aria-pressed="true" title="切换示例与空设备视图"><i></i><span>示例数据</span></button><button id="roleButton" onclick="login()">工程师登录</button></header>
<nav class="menubar" aria-label="应用菜单"><button onclick="desktopMenu('file',this)">文件(F)</button><button onclick="desktopMenu('device',this)">设备(D)</button><button onclick="desktopMenu('view',this)">视图(V)</button><button onclick="desktopMenu('tools',this)">工具(T)</button><button onclick="desktopMenu('help',this)">帮助(H)</button></nav>
<div class="toolbar" role="toolbar" aria-label="常用操作"><button class="toolbutton" onclick="connectDialog()" title="连接设备 (Ctrl+O)"><span class="tool-icon">⌁</span>连接</button><button class="toolbutton" onclick="scanDevices()" title="扫描RS485设备"><span class="tool-icon">⌕</span>扫描</button><span class="toolsep"></span><button class="toolbutton" id="toolbarRecord" onclick="toggleRecording()" title="开始或暂停记录 (Ctrl+Shift+L)"><span class="tool-icon">●</span><span>记录</span></button><button class="toolbutton" onclick="captureSpectrum()" title="采集当前光谱"><span class="tool-icon">▣</span>采集光谱</button><span class="toolsep"></span><button class="toolbutton" onclick="navigate('history')" title="查询历史记录"><span class="tool-icon">▤</span>历史</button><button class="toolbutton" onclick="navigate('spectrum/compare')" title="打开多光谱比较"><span class="tool-icon">∿</span>光谱比较</button><button class="toolbutton" onclick="navigate('export')" title="数据导出 (Ctrl+E)"><span class="tool-icon">⇩</span>导出</button><span class="toolsep toolbar-optional"></span><button class="toolbutton toolbar-optional" onclick="navigate('settings')" title="软件设置"><span class="tool-icon">⚙</span>设置</button></div><div class="workspaceTabs" id="workspaceTabs" aria-label="已打开的功能页"></div>
<nav class="utility-rail" aria-label="快捷工具"><div class="rail-brand">XPAR</div><button onclick="navigate('overview')" title="实时监测" aria-label="实时监测首页">⌂</button><button onclick="navigate('spectrum')" title="光谱分析" aria-label="打开光谱分析">∿</button><div class="rail-bottom"><button onclick="connectDialog()" title="连接设备" aria-label="连接设备侧栏">⌁</button><button onclick="toggleRecording()" title="开始或暂停记录" aria-label="开始或暂停记录">Ⅱ</button><button onclick="quickSettings()" title="快捷设置" aria-label="打开快捷设置">⚙</button><button onclick="navigate('help')" title="帮助" aria-label="打开帮助">?</button></div></nav><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main><footer class="footer"><span id="footConnection"></span><span id="footRecord"></span><span class="optional">本地模式 · UTC+08:00</span><span class="right">等待真实设备数据</span></footer><div id="modal"></div><div id="toast" hidden></div>
<script>
'use strict';

const uiPaths={
overview:'M3 13h4l3-7 4 13 3-9h4',devices:'M4 5h16v11H4z M8 20h8 M12 16v4',spectrum:'M3 19h18 M4 18c3 0 2-11 5-11s3 11 5 11 3-6 6-6',history:'M4 4v16h16 M7 15l4-5 4 3 5-7',analysis:'M5 19V11 M12 19V5 M19 19V8',export:'M12 3v12 m-4-4 4 4 4-4 M4 16v5h16v-5',tasks:'M8 3v4 M16 3v4 M4 7h16 M5 4h14v16H5z M8 11h3 M8 15h3',events:'M12 3 2 20h20L12 3z M12 9v5 M12 17h.01',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6 7 7 M17 17l1.4 1.4 M5.6 18.4 7 17 M17 7l1.4-1.4',engineering:'M14 6a5 5 0 0 0-7 6L3 17l4 4 5-5a5 5 0 0 0 6-7l-4 4-3-3z',backup:'M4 4h14l3 3v14H3V4z M7 4v6h9V4 M7 21v-7h10v7',help:'M9 8a3 3 0 1 1 5 2c-1 1-2 1-2 3 M12 17h.01 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',connect:'M8 3v5 M16 3v5 M5 8h14v3a7 7 0 0 1-14 0z M12 18v3',scan:'M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15 M16 16l5 5',record:'M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14',pause:'M8 4v16 M16 4v16',capture:'M4 5h16v15H4z M8 3v4 M16 3v4 M8 12h8 M8 16h5',reference:'M5 3h14v18l-7-4-7 4z',user:'M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M4 21v-2a8 8 0 0 1 16 0v2',chevron:'m7 10 5 5 5-5',info:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M12 11v6 M12 7h.01',folder:'M3 6h7l2 3h9v11H3z M3 6V4h7l2 2',clock:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M12 6v6l4 2',check:'m5 12 4 4L19 6',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',file:'M5 3h9l5 5v13H5z M14 3v6h5 M8 13h8 M8 17h6',filter:'M3 4h18l-7 8v7l-4 2V12z'
};
function uiIcon(name,large=false){return '<svg class="ui-icon'+(large?' lg':'')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(uiPaths[name]||uiPaths.info)+'"/></svg>'}
function uiEmpty(title,note='',kind='history',compact=false){return '<div class="ui-empty'+(compact?' compact':'')+'">'+uiIcon(kind)+'<strong>'+title+'</strong>'+(note?'<p>'+note+'</p>':'')+'</div>'}
function uiPlot(title,note='',kind='spectrum'){return '<div class="real-empty-plot"><div>'+uiIcon(kind,true)+'<b>'+title+'</b><p>'+note+'</p></div><span class="ui-axis-caption">'+(kind==='spectrum'?'波长 (nm)':'时间')+'</span></div>'}
function uiNote(text){return '<div class="ui-module-note">'+uiIcon('info')+'<span>'+text+'</span></div>'}
function uiDisabled(label,why='未连接设备',kind=''){return '<button type="button" disabled title="'+esc(why)+'">'+(kind?uiIcon(kind)+' ':'')+label+'</button>'}
function uiProperties(entries){return '<dl class="ui-property-list">'+(Array.isArray(entries)?entries:Object.entries(entries)).map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>'}
function uiLocalDate(offset=0){let d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uiShiftDay(day,n){return new Date(Date.parse(day+'T12:00:00Z')+n*86400000).toISOString().slice(0,10)}
function uiButton(label,call,cls='',kind=''){return '<button type="button" class="'+cls+'" onclick="'+call+'">'+(kind?uiIcon(kind)+' ':'')+label+'</button>'}
function uiSummary(label,value='—',unit='',note=''){return '<div class="statcard"><div class="statlabel">'+label+'</div><div class="statnum">'+value+(unit?'<em>'+unit+'</em>':'')+'</div>'+(note?'<div class="statnote">'+note+'</div>':'')+'</div>'}
function uiFileChosen(input){let root=input.closest('.ui-file-picker'),f=input.files[0],label=root.querySelector('.ui-file-label');if(f){label.textContent=f.name;label.dataset.selected='true';label.setAttribute('data-no-i18n','')}else{label.textContent='未选择文件';delete label.dataset.selected;label.removeAttribute('data-no-i18n')}document.querySelectorAll('[data-requires-file="'+input.id+'"]').forEach(b=>b.disabled=!f)}
function uiFilePicker(id,accept='.json'){return '<label class="ui-file-picker"><input id="'+id+'" type="file" accept="'+accept+'" aria-label="选择备份文件" onchange="uiFileChosen(this)"><span class="ui-file-browse">'+uiIcon('folder')+'选择文件</span><span class="ui-file-label">未选择文件</span></label>'}
function uiNormalizeControls(root=document){
 root.querySelectorAll('button:not([type])').forEach(b=>b.type='button');
 root.querySelectorAll('button:disabled:not([title])').forEach(b=>{b.title=b.hasAttribute('data-save')?'修改设置后可保存':b.hasAttribute('data-requires-file')?'请先选择备份文件':'连接设备并获取有效数据后可用'});
 root.querySelectorAll('input[type=number]').forEach(e=>e.setAttribute('inputmode','decimal'));
 root.querySelectorAll('button[onclick]').forEach(b=>{
  let code=b.getAttribute('onclick'),kind=null;
  if(b.closest('.toolbar,.desktop-toolbar')){
   kind=/connectDialog|connectionDialog|'connection'/.test(code)?'connect':/scanDevices/.test(code)?'scan':/toggleRecording|'record'/.test(code)?'record':/captureSpectrum|'capture'/.test(code)?'capture':/saveReference|'reference'/.test(code)?'reference':/'history'/.test(code)?'history':/'export'/.test(code)?'export':/'settings'/.test(code)?'settings':/compare/.test(code)?'spectrum':/startTour|'tour'/.test(code)?'help':null;
   let blocked=/scanDevices|toggleRecording|'record'|captureSpectrum|'capture'|saveReference|'reference'/.test(code);
   if(blocked){b.disabled=true;b.title='未连接设备';b.setAttribute('aria-disabled','true')}
   if(kind&&!b.querySelector('.ui-icon')){
    let old=b.querySelector('.tool-icon,span[aria-hidden=true],.icon');if(old)old.remove();
    b.insertAdjacentHTML('afterbegin',uiIcon(kind));
   }
  }
 });
 let box=document.getElementById('toast');if(box){box.setAttribute('role','status');box.setAttribute('aria-live','polite');box.setAttribute('aria-atomic','true')}
}
function uiWireDialogs(){
 let previousFocus=null;
 const observer=new MutationObserver(()=>{
  let dialog=document.querySelector('#modal [role=dialog]');
  if(dialog&&!dialog.dataset.uiReady){
   dialog.dataset.uiReady='true';previousFocus=document.activeElement;
   let title=dialog.querySelector('h2');if(title){title.id='ui-dialog-title';dialog.setAttribute('aria-labelledby',title.id)}
   let close=dialog.querySelector('.dialoghead button,.modal-head button');if(close){close.setAttribute('aria-label','关闭对话框');close.title='关闭'}
   uiNormalizeControls(dialog);
  }else if(!dialog&&previousFocus){let p=previousFocus;previousFocus=null;if(p.isConnected&&!p.disabled)p.focus()}
 });
 observer.observe(document.getElementById('modal'),{childList:true,subtree:true});
 document.addEventListener('keydown',e=>{
  let d=document.querySelector('#modal [role=dialog]');if(!d||e.key!=='Tab')return;
  let list=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length);
  if(!list.length)return;
  if(e.shiftKey&&(document.activeElement===list[0]||!d.contains(document.activeElement))){e.preventDefault();list.at(-1).focus()}
  else if(!e.shiftKey&&(document.activeElement===list.at(-1)||!d.contains(document.activeElement))){e.preventDefault();list[0].focus()}
 });
 document.addEventListener('input',uiFormChanged);document.addEventListener('change',uiFormChanged);
}
function uiFormChanged(e){let form=e.target.closest('.ui-form');if(!form||e.target.type==='file')return;form.dataset.dirty='true';form.querySelectorAll('[data-save]').forEach(b=>b.disabled=false);let state=form.querySelector('.ui-save-state');if(state)state.textContent='有未保存的更改';e.target.classList.remove('ui-input-error')}
function uiValidateNumber(el,label){let value=el.value.trim();if(value!==''&&!Number.isFinite(Number(value))){el.classList.add('ui-input-error');el.setAttribute('aria-invalid','true');el.focus();return label+'：请输入有效数值'}el.classList.remove('ui-input-error');el.removeAttribute('aria-invalid');return''}

function uiWireKeyboard(){document.addEventListener('keydown',e=>{let popup=document.querySelector('.desktop-popup');if(popup&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){let bs=[...popup.querySelectorAll('button:not(:disabled)')];if(!bs.length)return;let i=bs.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowUp'?-1:1)+bs.length)%bs.length;e.preventDefault();bs[i].focus();return}let active=document.activeElement;if(active?.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){let bs=[...active.closest('[role=tablist]').querySelectorAll('[role=tab]')],i=bs.indexOf(active);i=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowLeft'?-1:1)+bs.length)%bs.length;e.preventDefault();bs[i].click();let now=[...document.querySelectorAll('[role=tab][aria-selected=true]')].at(-1);now?.focus()}if(['ArrowDown','Enter',' '].includes(e.key)&&active?.matches('.menubar button,.desktop-menubar button')&&!popup){e.preventDefault();active.click();document.querySelector('.desktop-popup button:not(:disabled)')?.focus()}})}
function uiToggleGroup(group){let v={};try{v=JSON.parse(localStorage.getItem('xpar.nav.groups')||'{}')}catch{}v[group]=!v[group];try{localStorage.setItem('xpar.nav.groups',JSON.stringify(v))}catch{}$('#sidebar').innerHTML=renderDesktopSidebar();uiNormalizeControls($('#sidebar'))}
function uiAddExportRange(){let d=dayOf(Date.now());ranges.push({start:d+'T00:00',end:uiShiftDay(d,1)+'T00:00'});render()}
function uiRemoveExportRange(i){ranges.splice(i,1);render()}
function uiExportEmptyPreview(){return table(['时间',...exportKeys.slice(0,5).map(k=>META[k][0]+'<br><small>'+unit(k)+'</small>'),'质量'],[])}
function uiChangeExportKey(k,on){exportKeys=on?[...new Set([...exportKeys,k])]:exportKeys.filter(x=>x!==k);uiUpdateExportSelection()}

function weighted(c){let w=S.weights;if(!w)return null;let lo=w.points[0][0],hi=w.points.at(-1)[0];if(lo<c.lo||hi>c.hi)return null;let interp=(x,k)=>{let i=w.points.findIndex(p=>p[0]>=x);if(i===0)return w.points[0][k];if(i<0)return w.points.at(-1)[k];let a=w.points[i-1],b=w.points[i];return a[k]+(b[k]-a[k])*(x-a[0])/(b[0]-a[0])};return{a:integrate(c,lo,hi,x=>interp(x,1)),b:integrate(c,lo,hi,x=>interp(x,2))}}function loadDemoWeights(){toast('请导入实际参考权重文件。')}function weightDialog(){modal('导入a/b参考权重',`<p class="mb">CSV三列：波长nm、a权重、b权重；波长升序，权重为非负数。</p><input id="weightFile" type="file" accept=".csv"><div class="split"></div><div class="formgrid">${field('来源','<input id="weightSource" placeholder="填写论文、数据集或自定义来源">')}${field('版本','<input id="weightVersion" placeholder="例如 v1.0">')}${field('结果单位','<input id="weightUnit" placeholder="按已确认算法填写">')}${field('归一化说明','<input id="weightNorm" placeholder="例如原始权重，不归一化">')}</div>`,action('取消','closeModal()')+action('读取并保存','readWeights()','primary'))}async function readWeights(){try{let file=$('#weightFile').files[0],source=$('#weightSource').value.trim(),version=$('#weightVersion').value.trim(),unitVal=$('#weightUnit').value.trim(),normalization=$('#weightNorm').value.trim();if(!file||!source||!version||!unitVal||!normalization)return formError('请选择文件并填写来源、版本、单位和归一化说明。');let points=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/).map(l=>l.split(',').map(Number)).filter(a=>a.length===3&&a.every(Number.isFinite));if(points.length<3||points.some((p,i)=>p[1]<0||p[2]<0||(i&&p[0]<=points[i-1][0])))return formError('权重数据无效：至少3点，波长严格递增且权重非负。');S.weights={source,version,unit:unitVal,normalization,points,demo:false};log('权重配置',source+' '+version);closeModal();render()}catch{formError('CSV无法解析，请检查文件格式。')}}

function historyMetric(k,on){let next=on?[...historyKeys,k]:historyKeys.filter(x=>x!==k);if(!next.length||next.length>4){toast('历史曲线请选择1–4个指标');render();return}historyKeys=next;render()}function repairGaps(){if(!usable())return toast('设备离线，请先重新连接');let rs=queryRows().filter(r=>r.quality==='缺失');if(!rs.length)return toast('当前时段没有可补齐的数据');modal('增量补齐设备历史',`<p class="mb">${esc(device().name)} · 待恢复${rs.length}条，按设备SN与时间戳去重。</p><div class="progress"><span id="repairBar" style="width:15%"></span></div><p id="repairText" class="sectionnote">正在读取设备可恢复的记录…</p>`,action('关闭','closeModal()'));setTimeout(()=>{if(S.scenario==='failure'){if($('#repairText'))$('#repairText').textContent='读取超时，原有数据保留，缺口未填0。';log('数据补齐','设备读取超时','失败');return}for(let r of rs){let n={temp:25.4+Math.sin(r.seq*.2),rh:66+Math.cos(r.seq*.2),co2:940,pressure:1012,ppfd:520,eppfd:582};Object.assign(r,n,climate(n.temp,n.rh),{quality:'已补齐',source:'设备历史补齐'});enrichRecord(r)}refreshRecordedDLI();log('数据补齐','恢复'+rs.length+'条设备历史');if($('#repairBar'))$('#repairBar').style.width='100%';if($('#repairText'))$('#repairText').innerHTML=tag('补齐完成','green')+'　原有有效记录未覆盖。';render();},900)}

function taskDialog(){if(activeTask())return toast('当前设备已有活动任务，请先结束或取消。');let start=new Date(Date.now()+60000).toISOString().slice(0,16);modal('创建限时采集任务',`<div class="formgrid">${field('任务名称','<input id="taskName" value="临时采集测试" maxlength="40">')}${field('设备',`<input readonly value="${esc(device().name)} / ${device().model}">`)}${field('开始方式','<select id="taskWhen"><option value="now">立即开始</option><option value="later">1分钟后开始</option></select>')}${field('任务持续时间','<select id="taskDuration"><option value="120">2分钟（审阅演示）</option><option value="1800">30分钟</option><option value="3600">1小时</option><option value="7200">2小时</option></select>')}${field('环境记录周期（s）','<input id="taskEnv" type="number" min="1" value="10">')}${field('完整光谱周期（s）',`<input id="taskSpec" type="number" min="1" value="60" ${lightDevice()?'':'disabled'}>`)}</div><div class="split"></div><h3>结束 / 取消后恢复的原配置</h3><p class="muted">环境 ${S.settings.env}s；完整光谱 ${lightDevice()?S.settings.spectrum+'s':'不支持'}。快照会随任务保存。</p><p class="sectionnote">原型任务按本机时钟运行；测量图表使用固定演示日期，二者分别标识。</p>`,action('取消','closeModal()')+action('创建并启动','saveTask()','primary'))}function saveTask(){let name=$('#taskName').value.trim(),env=+$('#taskEnv').value,spec=+$('#taskSpec').value,duration=+$('#taskDuration').value,delay=$('#taskWhen').value==='later'?60000:0;if(!name||env<1||spec<1)return formError('请输入名称，周期必须为正数。');if(!usable())return formError('设备当前离线，不能下发任务。');if(S.scenario==='failure'){log('任务创建','下发超时','失败');return formError('下发失败，原配置未改变。')}let task={id:'TASK-'+Date.now().toString().slice(-7),name,device:S.selected,start:Date.now()+delay,end:Date.now()+delay+duration*1000,env,spec,state:delay?'待开始':'执行中',snapshot:{env:S.settings.env,spectrum:S.settings.spectrum},restore:null};S.tasks.unshift(task);if(!delay){S.settings.env=env;if(lightDevice())S.settings.spectrum=spec}log('任务创建',task.id+' / '+name);closeModal();render();toast('任务已创建并保存原配置快照')}
function taskDetails(id){let t=S.tasks.find(x=>x.id===id);modal('任务详情与配置快照',kv({'任务ID':esc(t.id),'名称':esc(t.name),'状态':tag(t.state,'blue'),'执行时间':new Date(t.start).toLocaleString()+' → '+new Date(t.end).toLocaleString(),'任务配置':`环境 ${t.env}s / 光谱 ${t.spec}s`,'原配置快照':`环境 ${t.snapshot.env}s / 光谱 ${t.snapshot.spectrum}s`,'数据边界':'按任务ID和实际起止时间关联，取消不删除已记录数据','恢复状态':esc(t.restore||'尚未到期'),'离线与重启':'正式实现需设备保存任务和快照；此处提供界面流程。'}),action('演示设备重启核对',`simulateTaskRestart('${id}')`)+action('演示立即到期',`closeModal();finishTask('${id}','已完成')`,'primary')+action('关闭','closeModal()'),true)}function simulateTaskRestart(id){log('任务核对',id+' 设备重启后核对有效期与原配置');toast('演示：任务与原配置快照仍保留，按有效期继续执行或恢复')}function cancelTask(id){confirmAction('取消任务并恢复原配置','将结束当前任务并恢复启动前的采集周期。已记录数据保留。',()=>finishTask(id,'已取消'))}function finishTask(id,state){let t=S.tasks.find(x=>x.id===id);if(!t)return;if(S.scenario==='failure'){t.state='恢复失败';t.restore='下发或回读超时，原配置快照保留';log('任务恢复',id,'失败');render();return}if(t.device===S.selected){S.settings.env=t.snapshot.env;S.settings.spectrum=t.snapshot.spectrum}t.state=state;t.restore='原配置已恢复，回读一致（演示）';log('任务恢复',id+' / '+state);render();toast('任务已结束，原配置已恢复并回读确认')}
function renderEvents(){return head('告警记录','查看超限、设备异常及恢复记录',uiButton('目标设置',"navigate('settings/targets')",'','settings'))+'<div class="fourstats" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+uiSummary('活动事件','0','条','尚无设备事件')+uiSummary('通信中断','0','次','仅统计已记录事件')+uiSummary('设备重启','0','次','以设备事件为依据')+'</div>'+panel('事件明细','<div class="ui-table-toolbar"><label>事件类型<select aria-label="事件类型" onchange="eventType=this.value;render()">'+selectOptions(['全部类型','目标超限','通信中断','传感器异常','重启'],eventType)+'</select></label><span class="spacer"></span><span class="ui-table-summary">0条记录 · '+tz()+'</span></div>'+table(['事件','设备','开始 / 结束','持续时长','状态','说明','操作'],[]),uiDisabled('导出 CSV','暂无设备事件','export'))}let eventType='全部类型';function ackEvent(id){S.events.find(e=>e.id===id).ack=true;log('事件确认',id);render();toast('已确认，超限仍持续；不会将异常改为正常')}function locateEvent(id){let e=S.events.find(x=>x.id===id);S.selected=e.device;historyKeys=e.param?[e.param]:['temp','rh'];let ds=dayOf(e.start);filters={start:ds+'T00:00',end:ds+'T23:59'};navigate('history');toast('已定位到事件所在日期；缺口和异常时段可查看')}function exportEvents(){download('XPAR_设备事件_演示.csv',csv([['事件ID','设备','类型','开始','结束','持续分钟','确认','依据','内容'],...S.events.filter(e=>eventType==='全部类型'||e.type===eventType).map(e=>[e.id,e.device,e.type,zoned(e.start,true),e.end?zoned(e.end,true):'',((e.end||ANCHOR)-e.start)/60000,e.ack,e.source,e.value])]));log('事件导出',eventType)}
function renderSettings(){let t=tab||'period';let out=head('软件设置','采样、目标范围、单位与统计时区',devPicker())+tabs([['period','采样设置'],['targets','目标范围'],['units','显示单位'],['time','时间与时区']],t);if(t==='period')return out+renderPeriods();if(t==='targets')return out+renderTargets();if(t==='time')return out+renderTimeSettings();return out+panel('显示与导出单位','<div class="ui-form ui-small-form"><div class="formgrid"><label class="field">温度单位<select id="tempUnit">'+selectOptions([['C','摄氏度 °C'],['F','华氏度 °F']],S.settings.temp)+'</select><small>温度与温差采用对应换算规则。</small></label><label class="field">大气压单位<select id="pressureUnit">'+selectOptions(['hPa','kPa'],S.settings.pressure)+'</select><small>显示、统计与导出单位保持一致。</small></label></div><div class="ui-form-footer"><button class="primary" data-save disabled onclick="saveUnits()">保存单位</button><span class="ui-save-state" aria-live="polite"></span></div></div>')+uiNote('单位切换不修改原始测量记录；积温统一按 °C·d 计算。')}
function renderPeriods(){return uiNote('连接设备后读取生效周期。修改后需由设备回读确认，未确认的配置不显示为已生效。')+panel('采样与刷新','<div class="formgrid"><label class="field">环境记录周期（秒）<input type="number" disabled placeholder="等待设备回读"><small>环境参数写入记录的时间间隔。</small></label><label class="field">界面刷新周期（秒）<input type="number" disabled placeholder="待配置"><small>只影响显示刷新，不替代数据采样。</small></label><label class="field">完整光谱采集周期（秒）<input type="number" disabled placeholder="等待设备回读"><small>与 PPFD 连续采样分别配置。</small></label><label class="field">场景预设<select disabled><option>连接设备后选择</option></select><small>按设备支持的周期范围显示可选项。</small></label></div><div class="ui-form-footer">'+uiDisabled('保存并回读','未连接设备')+'</div>')+panel('执行状态',table(['项目','生效周期','上次采集','下次采集','状态'],[['环境记录','—','—','—','等待设备'],['完整光谱','—','—','—','等待设备'],['界面刷新','—','—','—','待配置']]))}function applyPreset(v){let map={'默认0.5小时':1800,'植物工厂每天1次':86400,'温室每15分钟1次':900};if(map[v])$('#specPeriod').value=map[v]}function savePeriods(){let env=+$('#envPeriod').value,ui=+$('#uiPeriod').value,spec=+$('#specPeriod').value,preset=$('#periodPreset').value,once=$('#dailyTime').value;if(env<1||env>86400||ui<1||ui>60||spec<1||spec>86400)return toast('请检查周期范围：环境/光谱1–86400秒，界面1–60秒；均为原型演示范围。');if(activeTask())return toast('活动任务占用采样配置，请先结束或取消任务');if(!usable())return toast('设备离线，未下发配置');if(S.scenario==='failure'){log('周期配置','下发失败，保留原设置','失败');return toast('下发超时：原设置保留，界面未显示为已生效。')}let before=copy(S.settings);Object.assign(S.settings,{env,refresh:ui,spectrum:spec,preset,once});log('周期配置','下发并回读一致','成功',JSON.stringify(before),JSON.stringify(S.settings));render();toast('配置已保存；演示回读值一致')}
function renderTargets(){let keys=['temp','rh','co2','pressure','vpd','margin','ppfd','dli'];return panel('目标上下限','<div class="ui-form">'+uiNote('目标用于软件提示与统计，不控制灯具或环境设备。留空表示不设该侧限制。')+'<div class="tablewrap"><table><thead><tr><th scope="col">参数</th><th scope="col">下限</th><th scope="col">上限</th><th scope="col">单位</th></tr></thead><tbody>'+keys.map(k=>'<tr><td>'+META[k][0]+'</td><td><input id="targetLow-'+k+'" aria-label="'+META[k][0]+'下限" type="number" step="any" value="'+(S.targets[k]?.[0]==null?'':displayVal(k,S.targets[k][0]))+'" placeholder="不限"></td><td><input id="targetHigh-'+k+'" aria-label="'+META[k][0]+'上限" type="number" step="any" value="'+(S.targets[k]?.[1]==null?'':displayVal(k,S.targets[k][1]))+'" placeholder="不限"></td><td>'+unit(k)+'</td></tr>').join('')+'</tbody></table></div><div class="ui-subsection"><label class="field" style="max-width:290px">连续超限确认时间（秒）<input id="debounce" type="number" min="0" step="1" value="'+(S.settings.debounce??60)+'"><small>减少读数在阈值附近波动时的反复提示。</small></label></div><div id="targetsError" class="ui-field-error" role="alert"></div><div class="ui-form-footer"><button class="primary" data-save disabled onclick="saveTargets()">保存目标范围</button><span class="ui-save-state" aria-live="polite"></span></div></div>')}function inverseVal(k,n){if(['temp','dew'].includes(k)&&S.settings.temp==='F')return(n-32)/1.8;if(k==='margin'&&S.settings.temp==='F')return n/1.8;if(k==='pressure'&&S.settings.pressure==='kPa')return n*10;return n}function saveTargets(){let next=copy(S.targets),error=$('#targetsError');error.textContent='';for(let k of ['temp','rh','co2','pressure','vpd','margin','ppfd','dli']){let low=$('#targetLow-'+k),high=$('#targetHigh-'+k);for(let el of [low,high]){let m=uiValidateNumber(el,META[k][0]);if(m){error.textContent=m;return}}let a=low.value.trim()===''?null:inverseVal(k,Number(low.value)),b=high.value.trim()===''?null:inverseVal(k,Number(high.value));let message='';if(a!=null&&b!=null&&a>=b)message='下限必须小于上限';if(k==='rh'&&[a,b].some(v=>v!=null&&(v<0||v>100)))message='相对湿度须在 0–100%RH 内';if(['co2','pressure','vpd','ppfd','dli'].includes(k)&&[a,b].some(v=>v!=null&&v<0))message='目标值不能为负数';if(message){error.textContent=META[k][0]+'：'+message;high.classList.add('ui-input-error');high.setAttribute('aria-invalid','true');high.focus();return}next[k]=[a,b]}let delay=Number($('#debounce').value);if(!Number.isFinite(delay)||delay<0){error.textContent='确认时间须为有效的非负数';$('#debounce').focus();return}S.targets=next;S.settings.debounce=delay;let saved=log('目标配置','目标上下限及确认时间已更新');render();toast(saved?'目标范围已保存':'更改已应用于当前会话，但未能保存到本机。')}
function saveUnits(){let before=S.settings.temp+'/'+S.settings.pressure;S.settings.temp=$('#tempUnit').value;S.settings.pressure=$('#pressureUnit').value;let saved=log('单位设置','显示及导出单位已更新','成功',before,S.settings.temp+'/'+S.settings.pressure);render();toast(saved?'单位设置已保存':'更改已应用于当前会话，但未能保存到本机。')}function renderTimeSettings(){return panel('设备与本机时间',uiProperties({'本机时间':esc(new Date().toLocaleString('sv-SE')),'设备时间':'—','设备时钟偏差':'—','测量时间来源':'等待设备确认'})+'<div class="ui-form-footer">'+uiDisabled('与PC校时','未连接设备','clock')+'</div>')+panel('统计时区','<div class="ui-form ui-small-form"><label class="field ui-unit-select">统一统计时区<select id="timeZone">'+selectOptions([['Asia/Shanghai','Asia/Shanghai · UTC+08:00'],['Europe/Amsterdam','Europe/Amsterdam'],['America/New_York','America/New_York'],['America/Los_Angeles','America/Los_Angeles']],tz())+'</select><small>DLI、昼夜统计与积温使用相同的日界线。</small></label><div class="ui-form-footer"><button class="primary" data-save disabled onclick="saveZone()">保存时区</button><span class="ui-save-state" aria-live="polite"></span></div></div>')+uiNote('更改统计时区不会修改原始时间戳。')}function saveZone(){let zone=$('#timeZone').value;try{new Intl.DateTimeFormat('en',{timeZone:zone})}catch{return toast('请选择有效的统计时区')}S.settings.zone=zone;let saved=log('时区设置','统计时区更新为 '+zone);render();toast(saved?'统计时区已保存':'更改已应用于当前会话，但未能保存到本机。')}function syncClock(){confirmAction('设备与PC校时',`当前设备与演示时钟相差−12秒。确认后下发校时并回读；历史记录时间戳保持不变。`,()=>{if(!usable()||S.scenario==='failure'){log('设备校时','设备未响应','失败');return toast('校时失败，原设备时间保留。')}log('设备校时','与PC时间同步并回读');toast('演示：校时成功，历史时间戳未改变')})}
function scenarioChange(v){S.scenario=v;if(v==='offline'){if(!S.events.some(e=>e.id==='EV-DEMO-OFFLINE'))S.events.unshift({id:'EV-DEMO-OFFLINE',device:S.selected,type:'通信中断',start:ANCHOR-3*60000,end:null,value:'当前演示设备通信超时',source:'通信状态',ack:false})}if(v==='sensor'){if(!S.events.some(e=>e.id==='EV-DEMO-SENSOR'))S.events.unshift({id:'EV-DEMO-SENSOR',device:S.selected,type:'传感器异常',start:ANCHOR-2*60000,end:null,value:'RH模块异常；关联VPD与露点不可计算',source:'模块状态寄存器（演示）',ack:false})}if(v==='normal')S.events.forEach(e=>{if(e.id.startsWith('EV-DEMO')&&!e.end)e.end=ANCHOR});persist();render()}

function renderComm(){return uiNote('设备通信参数由设备回读。修改地址或波特率后需要重新连接并验证。')+panel('RS485 / Modbus RTU','<div class="formgrid">'+[['Modbus Slave ID','整数 1–247，同一总线地址不能重复。'],['Baud Rate','以设备支持的波特率为准。'],['数据位','—'],['校验位','—'],['停止位','—'],['超时（ms）','—']].map(([label,note])=>field(label,'<input disabled placeholder="等待设备回读">',note==='—'?'':note)).join('')+'</div><div class="ui-form-footer">'+uiDisabled('读取当前参数','未连接设备')+uiDisabled('保存并重新连接','未连接设备')+'</div>')+panel('Modbus TCP <span class="ui-count">预留</span>',uiProperties({'网关地址':'—','端口':'—','连接状态':'未配置'})+'<p class="ui-filter-meta">预留标准网关接入位置，当前未建立 TCP 连接。</p>')}function saveCommConfirm(){if(!requireEngineer())return;let d=device(),address=+$('#commAddress').value,baud=+$('#commBaud').value,bits=+$('#commBits').value,parity=$('#commParity').value,stop=+$('#commStop').value,timeout=+$('#commTimeout').value;if(!Number.isFinite(timeout)||timeout<100||timeout>10000)return toast('超时应为100–10000ms');if(!eng())return toast('当前账号无法执行此操作');if(!Number.isInteger(address)||address<1||address>247)return toast('地址必须是1–247的整数');if(S.devices.some(x=>x.id!==d.id&&x.address===address))return toast('总线上已存在该地址，请选择唯一地址');if(activeTask()||fwBusy)return toast('当前任务或升级占用配置，暂不可修改');let before=copy(d);confirmAction('确认修改设备通信参数',kv({'设备':esc(d.name),'地址':`${d.address} → ${address}`,'波特率':`${d.baud} → ${baud}`,'通信格式':`${bits} / ${parity} / ${stop}`,'读取超时':timeout+' ms'})+'<p class="sectionnote">下发后PC同步切换参数，重新连接并回读验证。</p>',()=>{if(S.scenario==='failure'||!usable()){log('通信配置','下发或重连超时','失败',JSON.stringify(before),'未改变');return toast('修改失败，原设备参数保留。')}Object.assign(d,{address,baud,bits,parity,stop,timeout});log('通信配置','下发后重连回读一致','成功',JSON.stringify(before),JSON.stringify(d));render();toast('参数修改成功；已重新连接并回读确认')})}
function renderCalibration(){return uiNote('用户偏移与工厂校准分别管理；恢复用户偏移不会擦除工厂校准数据。')+panel('用户偏移校准',table(['参数','原始值','偏移值','修正后','允许范围'],['temp','rh','co2'].map(k=>[META[k][0],'—','—','—','等待设备确认']))+'<p class="ui-filter-meta">最近用户校准：—</p><div class="ui-form-footer">'+uiDisabled('保存偏移并回读','未连接设备')+uiDisabled('恢复工厂校准配置','未连接设备')+'</div>')}function previewCal(k,v){$('#calPreview-'+k).textContent=fmt(current()[k]+Number(v),1)}function saveCalibration(){if(!requireEngineer())return;let next={temp:+$('#cal-temp').value,rh:+$('#cal-rh').value,co2:+$('#cal-co2').value};if(Object.values(next).some(v=>!Number.isFinite(v))||Math.abs(next.temp)>5||Math.abs(next.rh)>10||Math.abs(next.co2)>200)return toast('偏移值超出演示允许范围，请调整后保存。');confirmAction('确认保存用户偏移',kv(Object.fromEntries(Object.keys(next).map(k=>[META[k][0],S.cal[k]+' → '+next[k]]))),()=>{if(!usable()||S.scenario==='failure'){log('偏移校准','下发失败','失败');return toast('写入失败，原校准配置保留。')}let before=JSON.stringify(S.cal);S.cal=next;S.calTime=nowText();log('偏移校准','保存并回读一致','成功',before,JSON.stringify(next));render();toast('偏移已保存，原始值与修正值分别保留')})}function restoreCalibration(){if(!requireEngineer())return;confirmAction('恢复工厂校准配置','将所有用户偏移恢复为0；工厂校准数据不会被擦除。',()=>{if(S.scenario==='failure')return toast('恢复失败，原配置保留');S.cal={temp:0,rh:0,co2:0};S.calTime=nowText();log('校准恢复','用户偏移置0；工厂校准数据保留');render()})}

function renderFirmware(){return panel('设备与固件',uiProperties({'目标设备':'—','当前固件':'—','连接状态':'未连接设备','升级状态':'等待设备'})+'<div class="ui-subsection"><label class="field">固件文件<input type="file" accept=".bin,.hex" disabled><small>连接设备并核对型号、版本与兼容性后才可升级。</small></label></div><div class="ui-form-footer">'+uiDisabled('开始升级','未连接设备')+'</div>')+uiNote('升级期间保持设备供电与连接；发生失败时保留状态和恢复指引。')}function chooseFirmware(f){if(!f)return;let model=f.name.match(/X(?:300|400)/i)?.[0]?.toUpperCase();firmware={name:f.name,model,version:'待读取',demo:false};render()}function upgradeFirmware(){if(!requireEngineer())return;if(!firmware)return toast('请先选择固件');if(firmware.model!==device().model)return toast('固件型号不匹配或无法识别，禁止升级。');if(activeTask())return toast('有活动任务，请先结束后再升级');if(!usable())return toast('设备离线，请检查连接');if(fwBusy)return;confirmAction('确认固件升级',`设备 ${device().model} / ${device().sn}<br>固件 ${esc(firmware.name)}<p class="sectionnote">升级期间当前设备暂停采集并锁定配置。请保持连接和供电。</p>`,()=>{fwBusy=true;let p=0;let timer=setInterval(()=>{p+=10;if($('#firmwareProgress'))$('#firmwareProgress').style.width=p+'%';if($('#firmwareStatus'))$('#firmwareStatus').textContent='演示升级进度 '+p+'%';if(S.scenario==='failure'&&p>=40){clearInterval(timer);fwBusy=false;if($('#firmwareStatus'))$('#firmwareStatus').innerHTML='<span class="badtext">传输失败。保持设备供电 → 检查串口与型号 → 重新进入升级模式并重试；若无法识别，联系工程师恢复。</span>';log('固件升级','传输中断','失败');return}if(p>=100){clearInterval(timer);fwBusy=false;log('固件升级',firmware.name+' 升级完成并重新识别');if($('#firmwareStatus'))$('#firmwareStatus').innerHTML='<span class="goodtext">升级成功（演示），已重新识别设备；版本1.1.0-demo。</span>';toast('演示固件升级流程完成')}},230)})}

function renderBackup(){return head('数据备份','保存本机配置与记录，恢复前核对覆盖范围')+'<div class="grid equal2">'+panel('创建备份',uiProperties({'测量记录':S.records.length+'条记录','设备配置':S.devices.length+'台','最近备份':S.lastBackup?esc(S.lastBackup):'尚未备份','包含内容':'配置、目标、记录、波段、参考光谱及任务快照'})+'<div class="ui-form-footer">'+uiButton('导出备份','backupNow()','primary','backup')+'</div>')+panel('从文件恢复',uiFilePicker('backupFile')+'<p class="ui-filter-meta">选择本软件导出的 JSON 备份文件，最大 12 MB。</p><div id="restoreError" class="ui-field-error" role="alert"></div><div class="ui-form-footer"><button class="primary" data-requires-file="backupFile" disabled onclick="previewRestore()">'+uiIcon('folder')+' 校验并预览</button></div>')+'</div>'+panel('恢复说明','<div class="ui-muted-note">恢复前会显示备份时间、设备数量和记录数量，并保存当前快照。恢复不更换当前账号；密码不写入备份。有活动任务时不能覆盖恢复。设备连接状态不随备份恢复为在线。</div>')}function backupNow(){try{S.lastBackup=nowText();let payload={schema:'XPAR-UI-1',created:new Date().toISOString(),state:copy(S)};payload.state.role='User Access';payload.state.devices.forEach(d=>d.online=false);download('XPAR_backup_'+uiLocalDate().replaceAll('-','')+'.json',JSON.stringify(payload,null,2),'application/json');log('数据库备份',S.records.length+'条记录');render();toast('备份文件已生成，请确认浏览器下载。')}catch{toast('无法生成备份文件，请重试。')}}let pendingRestore=null;async function previewRestore(){let error=$('#restoreError');try{if(S.tasks.some(t=>['执行中','待开始','恢复失败'].includes(t.state)))throw new Error('请先结束活动任务并确认原配置恢复');let f=$('#backupFile').files[0];if(!f)throw new Error('请选择备份文件');if(f.size>12000000)throw new Error('备份文件过大；仅接受12MB以内文件');let b=JSON.parse(await f.text()),s=b.state;if(b.schema!=='XPAR-UI-1'||s?.schema!=='XPAR-UI-1'||!Array.isArray(s.devices)||!Array.isArray(s.records)||!s.settings||typeof s.settings!=='object'||Array.isArray(s.settings)||!s.targets||typeof s.targets!=='object'||Array.isArray(s.targets))throw new Error('备份版本或结构不兼容，未修改当前数据');for(let k of ['tasks','logs','events','refs','bands','bandArchive'])if(s[k]!==undefined&&!Array.isArray(s[k]))throw new Error('备份版本 function renderHelp(){let t=tab||'guide';if(t==='coverage')t='guide';let out=head('帮助与支持','连接、记录、分析和维护说明')+tabs([['guide','使用说明'],['parameters','参数说明'],['about','关于软件']],t);if(t==='about')return out+renderAbout();if(t==='parameters')return out+panel('参数说明 <span class="ui-count">'+PARAMS.length+'</span>','<div class="ui-search">'+uiIcon('search')+'<input id="parameterSearch" aria-label="搜索参数" placeholder="搜索温度、湿度、VPD、光谱…" oninput="filterParameters()"></div><div id="parameterTable">'+parameterTable(PARAMS)+'</div><p class="ui-filter-meta">可用参数与有效测量范围以设备信息为准；计算指标由有效测量记录产生。</p>');let steps=[['connect','连接设备','选择接口和串口，连接后核对设备信息。','devices'],['overview','查看与记录','查看数值与光谱，开始保存测量记录。','overview'],['export','分析与导出','查询时段、检查数据质量，再导出所需参数。','export']];return out+panel('快速上手','<div class="ui-help-steps">'+steps.map(([i,h,p,r])=>'<div class="ui-help-step">'+uiIcon(i)+'<h3>'+h+'</h3><p>'+p+'</p>'+uiButton('打开',"navigate('"+r+"')",'small')+'</div>').join('')+'</div>')+panel('常见问题','<details open><summary>设备未连接或读数显示“—”怎么办？</summary><p>检查供电、USB 与 RS485 接线，并确认串口和通信参数。没有有效读数时显示“—”，缺失记录不填0。</p></details><details><summary>空气 VPD、露点与 DLI 如何理解？</summary><p>空气 VPD 与露点使用同期空气温度和相对湿度计算；空气露点裕量不能直接判定叶片结露。DLI 是一天内有效 PPFD 的时间积分，同时需要关注有效覆盖率。</p></details><details><summary>怎样导出数据？</summary><p>在“导出与报告”选择设备、时段和参数。预览与 CSV、Excel、图表使用相同筛选结果，时间戳、单位和质量标记一并保留。</p></details><details><summary>如何进入设备维护？</summary><p>使用右上角“工程师登录”进入维护模式。退出后返回用户模式，维护页面关闭，本地记录保留。</p></details><details><summary>怎样保存本机配置？</summary><p>在“数据备份”导出 JSON 文件。恢复时先预览内容与覆盖范围，有活动任务时请先结束任务。</p></details>')}

<script id="xpar-i18n">
(function xparLanguageLayer(dictionary){
 'use strict';
 const han=/[\u3400-\u9fff]/;
 const keys=Object.keys(dictionary).sort((a,b)=>b.length-a.length);
 const pattern=new RegExp(keys.map(k=>k.replace(/[.*+?^$()|[\]\\{}]/g,'\\$&')).join('|'),'g');
 const originals=new WeakMap(), rendered=new WeakMap(), attributes=new WeakMap();
 let language='zh', pending=false, roots=new Set();
 try{language=localStorage.getItem('xpar.language')==='en'?'en':'zh'}catch{}
 function english(value){
  if(!han.test(value))return value;
  if(dictionary[value.trim()])return value.replace(value.trim(),dictionary[value.trim()]);
  return value.replace(pattern,m=>' '+dictionary[m]+' ').replace(/，/g,', ').replace(/。/g,'. ').replace(/；/g,'; ').replace(/：/g,': ').replace(/（/g,' (').replace(/）/g,') ').replace(/[“”]/g,'"').replace(/、/g,', ').replace(/[ \t]{2,}/g,' ').replace(/ +([,.;:)])/g,'$1').replace(/([(]) +/g,'$1').trim();
 }
 function allowed(el){return el&&!el.closest('script,style,textarea,[data-no-i18n]')}
 function localize(root){
  if(root.nodeType===3){textNode(root);return}
  if(root.nodeType!==1||!allowed(root))return;
  const nodes=[root,...root.querySelectorAll('*')];
  for(const el of nodes){
   if(!allowed(el))continue;
   if(el.tagName==='OPTION'&&!el.hasAttribute('value'))el.setAttribute('value',el.value);
   let state=attributes.get(el);if(!state){state={};attributes.set(el,state)}
   for(const key of ['title','placeholder','aria-label','alt']){
    if(!el.hasAttribute(key))continue;
    const now=el.getAttribute(key),entry=state[key];
    const original=entry&&now===entry.output?entry.original:now;
    const output=language==='en'?english(original):original;
    state[key]={original,output};
    if(now!==output)el.setAttribute(key,output);
   }

  if(!allowed(n.parentElement))return;
  const now=n.nodeValue,previous=rendered.get(n);
  const original=originals.has(n)&&now===previous?originals.get(n):now;

  rendered.set(n,output);
  if(now!==output)n.nodeValue=output;
 }
 const originalTitle=document.title;
 function controls(){
  document.documentElement.lang=language==='en'?'en':'zh-CN';
  document.documentElement.dataset.language=language;
  document.title=language==='en'?english(originalTitle):originalTitle;
  document.querySelectorAll('[data-language]').forEach(button=>{
   const selected=button.dataset.language===language;
   button.classList.toggle('selected',selected);
   button.setAttribute('aria-pressed',String(selected));
  });
 }
 function setLanguage(next,save=true){
  language=next==='en'?'en':'zh';

 }
 document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.language)));

  for(const item of records){
   if(item.type==='childList')for(const node of item.addedNodes)roots.add(node);

   pending=false;const batch=[...roots];roots.clear();
   for(const node of batch)if(node.isConnected)localize(node);
  })}
 });

 observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','placeholder','aria-label','alt']});
 window.addEventListener('storage',event=>{if(event.key==='xpar.language')setLanguage(event.newValue,false)});
 window.xparSetLanguage=setLanguage;

alyzed parameter","统计结果；按设备、参数及日/周/自定义时段显示，附有效数据范围；缺失值不填0。":"Statistics by device, parameter and day/week/custom range, with valid data coverage. Missing values are not filled with zero.","明期/暗期平均值":"Light/dark period means","统计结果；依据PPFD阈值划分明暗，分别显示环境及光指标均值；标明阈值和有效数据范围。无PPFD的型号需另定划分方式。":"Light and dark periods use a PPFD threshold. Climate and light means show the threshold and valid coverage. Models without PPFD require another classification method.","明期时长":"Light-period duration","光周期":"Photoperiod","统计结果；显示每天PPFD高于明暗阈值的有效时长；阈值、日界线及缺失时段应明确。":"Daily valid duration with PPFD above the threshold. Threshold, day boundary and missing intervals are shown.","暗期时长":"Dark-period duration","统计结果；显示每天PPFD低于或等于明暗阈值的有效时长；缺失时段不能自动计为暗期。":"Daily valid duration at or below the PPFD threshold. Missing intervals are not counted as darkness.","目标区间达标率":"Time within target range","统计结果；有效数据处于目标上下限范围内的时间占比；展示目标及有效时长，缺失时段不算达标。":"Percentage of valid time within the target limits. Targets and valid duration are shown; missing intervals do not count as in-range.","超限次数":"Excursion count","统计结果；按设备、参数及高于/低于目标分别计数；连续超限如何合并为一次、阈值附近如何防反复触发需统一。":"Counted by device, parameter and above/below target. Rules for merging continuous excursions and preventing repeated threshold triggers require agreement.","超限累计时长":"Total excursion duration","统计结果；有效超限时段的时长总和；支持与趋势定位及导出，缺口不延伸计时。":"Sum of valid excursion durations, with chart navigation and export. Timing does not extend across gaps.","最长单次超限时长":"Longest excursion duration","统计结果；显示最长连续超限时长及对应起止时间；沿用统一的超限事件划分规则。":"Longest continuous excursion with start and end times, using shared event classification rules.","日平均气温":"Daily mean air temperature","可换算显示°F":"Can be displayed in °F","统计结果；按有效温度记录覆盖时长加权，显示每日明细及有效覆盖率；未完整日另行标识。":"Time-weighted mean of valid temperature records, with daily details and coverage. Partial days are labeled separately.","日平均气温累加":"Sum of daily mean air temperatures","统计结果；按设定起点累计日均温，不默认减基温或截断负温；完整日累计与未完整日暂估分开。":"Daily means accumulated from the selected start, without base subtraction or negative clipping. Complete-day totals and partial-day estimates are separate.","数据质量统计；有效数据覆盖时长占统计时段的比例；积温最低有效覆盖阈值未配置，支持明细及导出。":"Valid data duration divided by the analysis period. Minimum coverage for temperature sums is not configured. Details and export are available.","叶绿素a参考加权响应":"Chlorophyll a weighted response","叶绿素b参考加权响应":"Chlorophyll b weighted response","依权重及公式定义":"Depends on weights and formula","X400；对同一光谱按叶绿素a参考权重加权积分，显示响应值及对比差异；保留权重来源与版本。权重、公式及结果单位未配置；不是叶绿素含量。":"X400: integrates a spectrum with chlorophyll a reference weights, showing response and comparison differences. Weight source and version are retained. Weights, formula and units are not configured. This is not chlorophyll content.","X400；对同一光谱按叶绿素b参考权重加权积分，显示响应值及对比差异；保留权重来源与版本。权重、公式及结果单位未配置；不是叶绿素含量。":"X400: integrates a spectrum with chlorophyll b reference weights, showing response and comparison differences. Weight source and version are retained. Weights, formula and units are not configured. This is not chlorophyll content.","工具栏可开始或暂停记录。打开“历史记录”选择日期和参数；打开“导出与报告”选择设备、时段及参数，可保存CSV、Excel或PNG图表。暂停记录不会删除历史数据。":"Start or pause recording from the toolbar. Select dates and parameters in Historical records. In Export & reports, select devices, periods and parameters to save CSV, Excel or PNG charts. Pausing does not delete history.","空气VPD表示空气的水汽压亏缺。露点温度表示空气中的水汽开始凝结时的温度；空气露点裕量不直接判断叶片是否结露。DLI表示一天累计的光照量，数据缺失时同时关注记录覆盖率。":"Air VPD is the vapor pressure deficit of air. Dew point is the temperature at which water vapor starts condensing. Air dew point margin does not determine leaf condensation. DLI is accumulated daily light; check coverage when data is missing.","选择支持光谱的设备，进入“光谱分析 → 多光谱比较”。最多可选择6条光谱，并指定一条参考光谱。归一化用于比较曲线形状，绝对PFD使用原始光谱计算。":"Select a spectrum-capable device and open Spectrum analysis → Spectrum comparison. Select up to six spectra and designate a reference. Normalization compares shapes; absolute PFD uses original spectra.","首页显示 ddress","预留标准网关接入位置，当前未建立 TCP 连接。":"Reserved for a standard gateway. No TCP connection is active.","用户偏移与工厂校准分别管理；恢复用户偏移不会擦除工厂校准数据。":"User offsets and factory calibration are managed separately. Resetting user offsets preserves factory calibration.","允许范围":"Allowed range","最近用户校准：—":"Last user calibration: —","通信报文":"Communication log","暂停显示":"Pause display","保存日志":"Save log","建立设备连接后显示实际收发与错误记录。":"Actual traffic and error logs appear after connecting a device.","清空显示不删除历史测量数据。":"Clearing the display preserves historical measurements.","设备与固件":"Device and firmware","固件文件":"Firmware file","连接设备并核对型号、版本与兼容性后才可升级。":"Connect a device and verify its model, version and compatibility before updating.","升级期间保持设备供电与连接；发生失败时保留状态和恢复指引。":"Maintain power and connection during updates. Failures retain status and recovery guidance.","暂无操作记录":"No activity logs","暂无测量数据":"No measurement data","修改设置后可保存":"Edit settings to enable saving","请先选择备份文件":"Choose a backup file first","连接设备并获取有效数据后可用":"Available after connecting a device and acquiring valid data","趋势参数":"Trend parameter","时间与时区":"Time and time zone","温度单位":"Temperature unit","大气压单位":"Air pressure unit","本地保存":"Local storage","示例数据 · 非实测":"Example data · Not measured","切换示例与空设备视图":"Switch between example data and an empty device view","空设备视图":"Empty device view","示例设备":"Example device","示例设备 · 非实际连接":"Example device · No physical connection","示例模式不下发设备指令":"Device commands are disabled in example mode","XPAR · 示例设备":"XPAR · Example devices","示例日期":"Example date","示例时间":"Example time","示例数据":"Example data","示例有效":"Example valid","示例在线":"Example online","种植区 A":"Grow zone A","种植区 B":"Grow zone B","示例定义":"Example definition","示例记录":"example records","条示例记录":" example records","示例范围":"Example range","当前示例":"Current example","参考示例":"Example reference","参考光谱 · 示例":"Reference spectrum · Example","示例波段":"Example band","示例波长区间":"Example wavelength range","导出示例光谱":"Export example spectrum","导出示例 CSV":"Export example CSV","导出示例 Excel":"Ex
