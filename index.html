le": "Engineer Access", "ui": "与设备事件分开展示；导出记录含字段说明与时区。", "note": "P1；记录保留策略不影响测量数据；与设备事件按事件ID关联。", "route": "engineering/audit"}, {"row": 12, "module": "设备连接", "name": "RS485/USB-RS485连接", "desc": "识别并选择COM口，连接/断开设备，显示通讯状态；断线时提示并保留最后更新时间。", "priority": "P0", "role": "User Access", "ui": "工程信息清楚、操作直接", "note": "P0优先完成连接、断线提示和重新连接；多设备接入见“RS485多设备识别”。", "route": "devices"}, {"row": 13, "module": "设备连接", "name": "设备与校准信息", "desc": "显示型号、序列号、固件、量程、精度、工厂校准日期、校准编号和建议复校日期", "priority": "P0", "role": "User Access", "ui": "只显示必要信息", "note": "强化专业精度与可追溯性", "route": "devices"}, {"row": 14, "module": "实时监测", "name": "实时数据显示", "desc": "显示温度、RH、CO₂、空气VPD、露点及全部可用传感器数据；支持Dashboard参数勾选及偏好保存。", "priority": "P0", "role": "User Access", "ui": "多设备列表和单设备详情；露点默认显示", "note": "VPD由空气温度和RH计算；露点由同一时刻的温湿度计算。", "route": "overview"}, {"row": 15, "module": "实时监测", "name": "实时趋势曲线", "desc": "支持温度、RH、CO₂、VPD、露点等多参数趋势、时间轴缩放与选择", "priority": "P0", "role": "User Access", "ui": "支持2–4个参数叠加和时间范围选择", "note": "叠加空气温度与露点，查看接近饱和趋势；不直接判定叶片结露。", "route": "overview"}, {"row": 16, "module": "实时监测", "name": "光谱曲线", "desc": "显示完整实时光谱和光指标", "priority": "P0", "role": "User Access", "ui": "X400显示完整SPD及主要光指标", "note": "第一版核心展示", "route": "spectrum/live"}, {"row": 17, "module": "数据记录", "name": "连续数据记录", "desc": "按设定采样间隔将多设备数据持续写入本地数据库，并显示存储容量和预计可记录时长", "priority": "P0", "role": "User Access", "ui": "记录状态、磁盘空间和最后写入时间清晰", "note": "竞品普遍能力；本地优先核心", "route": "history"}, {"row": 18, "module": "数据记录", "name": "历史查询与数据完整性", "desc": "按设备和时间查询数据；自动标识缺失时段，设备重连后执行增量补齐", "priority": "P0", "role": "User Access", "ui": "缺口、补齐状态和数据来源可追踪", "note": "避免长期分析因断线失真", "route": "history"}, {"row": 19, "module": "数据记录", "name": "CSV/Excel导出", "desc": "按设备、多个不连续时段和参数导出CSV/Excel及对应图表；细分规则见“不连续时段多选”和“参数多选与数据导出”。", "priority": "P0", "role": "User Access", "ui": "导出前预览数据条数、时段、参数和单位；图表与数据采用相同筛选条件。", "note": "P0包含CSV/Excel与图表导出；筛选、字段及预览采用同一规则。", "route": "export"}, {"row": 20, "module": "数据记录", "name": "基础报告导出", "desc": "按设备和时段生成固定格式环境或光谱摘要，包含主要统计、数据覆盖情况及设备信息；支持预览和导出。", "priority": "P1", "role": "User Access", "ui": "固定模板；显示设备、时段、单位和生成时间；不提供报告编辑器。", "note": "P1完整功能；复用历史统计与光谱数据，报告格式由双方确认。", "route": "export/report"}, {"row": 21, "module": "软件设置", "name": "采样周期", "desc": "分别配置环境记录、界面刷新和完整光谱采集周期；保存后回读生效值，失败时提示并保留原设置。", "priority": "P0", "role": "User Access", "ui": "标明周期用途及设备允许范围；仅显示确认生效的设置。", "note": "基本下发与回读纳入P0；详细执行状态见“周期下发与执行状态”。", "route": "settings/period"}, {"row": 22, "module": "软件设置", "name": "光谱默认周期与场景预设", "desc": "完整光谱采集间隔暂按0.5小时；保留植物工厂每天1次、温室每15分钟1次预设；允许自定义。", "priority": "P0", "role": "User Access", "ui": "标明预设及设备允许范围；每天1次可设置执行时刻。", "note": "未配置：0.5小时口径、PPFD是否独立持续采样及DLI数据来源。", "route": "settings/period"}, {"row": 23, "module": "软件设置", "name": "周期下发与执行状态", "desc": "在“采样周期”基本下发与回读基础上，展示环境记录、光谱采集和界面刷新状态；显示下一次采集时间及预计存储量。", "priority": "P1", "role": "User Access", "ui": "显示实际生效周期和详细执行状态；失败时明确提示。", "note": "基本设置确认已纳入“采样周期”P0；本项为P1详细执行状态展示。", "route": "settings/period"}, {"row": 24, "module": "模块诊断", "name": "传感器模块状态", "desc": "查看各传感器正常/异常/离线等状态", "priority": "P0", "role": "User Access", "ui": "异常状态突出显示", "note": "", "route": "devices"}, {"row": 25, "module": "多设备", "name": "RS485多设备识别", "desc": "扫描并轮询同一总线上的多台传感器；显示设备地址、型号及在线状态。", "priority": "P0", "role": "User Access", "ui": "显示地址、型号、在线状态", "note": "P0包含扫描、轮询和在线状态；展示及联调设备数量由双方确认。", "route": "devices"}, {"row": 26, "module": "多设备", "name": "设备分组和命名", "desc": "按房间/区域进行简单分组并设置设备名称", "priority": "P0", "role": "User Access", "ui": "只做房间—设备两级结构", "note": "", "route": "devices"}, {"row": 27, "module": "帮助", "name": "使用说明", "desc": "提供连接、参数配置、记录、导出和诊断的基础说明；可打开完整使用手册。", "priority": "P1", "role": "User Access", "ui": "普通用户可查看；工程功能说明标明所需权限。", "note": "P1；使用说明与实际界面及支持的设备版本保持一致。", "route": "help"}, {"row": 28, "module": "软件维护", "name": "检查更新", "desc": "检查软件版本并显示新版本信息；提供官方下载安装入口。", "priority": "P1", "role": "User Access", "ui": "检查失败时提示，不影响当前软件使用。", "note": "P1；先采用手动下载更新，不额外开发自动升级流程。", "route": "help/about"}, {"row": 29, "module": "历史分析", "name": "基础时段统计", "desc": "最大值 function captureSpectrum(){if(!lightDevice())return toast('当前设备不支持光谱分析');if(!usable())return toast('设备离线，不能采集新光谱。');tick++;log('光谱采集','手动获取完整光谱快照');render();toast('已采集演示光谱，时间已刷新')}function saveReference(){modal('保存光谱参考',field('参考名称','<input id="refName" maxlength="50" value="种植架A · 当前灯配方">')+'<p class="sectionnote">保存绝对光谱、单位、有效波长范围、设备和采集时间，供后续比较。</p>',action('取消','closeModal()')+action('保存','commitReference()','primary'))}function commitReference(){let name=$('#refName').value.trim();if(!name)return formError('请输入参考名称');let c=copy(curve());c.id='saved'+Date.now();c.name=name;c.source='保存的目标光谱';S.refs.push(c);log('参考光谱',name);closeModal();render();toast('参考已保存，可在多光谱比较中选择')}function exportSpectrum(){let c=curve();download('XPAR_光谱_演示.csv',csv([['设备',device().sn,'时间',zoned(c.time,true),'单位',c.unit],['波长_nm','光子光谱密度'],...c.values]));log('光谱导出',c.name)}
function renderComparison(){let all=['live','history1','history2','history3','target',...S.refs.map(r=>r.id)].map(curve),chosen=curveIds.map(curve),reference=curve(refId);let lo=+previewBand.lo,hi=+previewBand.hi,base=integrate(reference,lo,hi);let rows=chosen.map((c,i)=>{let p=integrate(c,lo,hi),r=integrate(c,600,700),b=integrate(c,400,500),fr=integrate(c,700,800);return[`<span class="swatch" style="background:${COLORS[i%6]}"></span>${esc(c.name)} ${c.id===refId?tag('参考','blue'):''}`,fmt(p,2),p==null||base==null?'—':fmt(p-base,2),!base||p==null?'不可计算':fmt((p-base)/base*100,2)+'%',!b?'—':fmt(r/b,2),!fr?'—':fmt(r/fr,2)]});return panel('选择光谱',`<div class="checks mb">${all.map(c=>`<label><input type="checkbox" ${curveIds.includes(c.id)?'checked':''} onchange="chooseCurve('${c.id}',this.checked)">${esc(c.name)}</label>`).join('')}</div><div class="row"><label>参考曲线 <select onchange="refId=this.value;render()">${selectOptions(chosen.map(c=>[c.id,c.name]),refId)}</select></label><label>积分区间 <input aria-label="比较起始波长" id="compareLo" type="number" min="350" max="1050" value="${lo}"> – <input aria-label="比较结束波长" id="compareHi" type="number" min="350" max="1050" value="${hi}"> nm</label>${action('应用波段','applyCompareBand()','small')}<label><input type="checkbox" ${norm?'checked':''} onchange="norm=this.checked;render()"> 归一化曲线</label><span class="spacer"></span>${action('读取参考文件','importReference()','small')}</div>`)+panel('光谱叠加与PFD比较',`${spectrumChart('compare',chosen,norm,[{lo,hi}])}<p class="sectionnote">图中归一化仅改变曲线显示；下表始终基于绝对光谱积分。仅比较相同单位和有效交集范围。</p>${table(['光谱','PFD绝对值','差值','相对变化率','R/B','R/FR'],rows)}<p class="sectionnote">PFD单位 μmol·m⁻²·s⁻¹；差值＝当前−参考；相对变化率＝差值÷参考×100%。演示比例：R 600–700 / B 400–500 / FR 700–800nm，最终边界未配置。</p>`,action('导出对比CSV','exportCompare()','small primary')+action('导出图表',"exportPNG('compare')",'small'))}
function chooseCurve(id,on){let a=on?[...curveIds,id]:curveIds.filter(x=>x!==id);if(a.length<1||a.length>6){toast('请选择1–6条光谱');render();return}curveIds=a;if(!a.includes(refId))refId=a[0];render()}function applyCompareBand(){let a=+$('#compareLo').value,b=+$('#compareHi').value,cs=curveIds.map(curve);if(!(a<b)||cs.some(c=>a<c.lo||b>c.hi))return toast('起始波长必须小于结束波长，且位于所有曲线的有效交集范围。');previewBand={lo:a,hi:b};render()}function exportCompare(){let ref=curve(refId),refAB=weighted(ref),base=integrate(ref,previewBand.lo,previewBand.hi),rows=[['演示数据；积分区间',previewBand.lo,previewBand.hi,'nm'],['光谱','PFD_μmol·m⁻²·s⁻¹','差值_μmol·m⁻²·s⁻¹','相对变化率_%','参考光谱','R/B','R/FR','叶绿素a加权响应','叶绿素b加权响应','a相对参考差值','b相对参考差值','权重版本','响应单位']];for(let id of curveIds){let c=curve(id),p=integrate(c,previewBand.lo,previewBand.hi),r=integrate(c,600,700),b=integrate(c,400,500),fr=integrate(c,700,800),ab=weighted(c);rows.push([c.name,p,p==null?null:p-base,base&&p!=null?(p-base)/base*100:null,ref.name,b?r/b:null,fr?r/fr:null,ab?.a,ab?.b,ab&&refAB?ab.a-refAB.a:null,ab&&refAB?ab.b-refAB.b:null,S.weights?.version||'未配置',S.weights?.unit||'未定'])}download('XPAR_光谱比较_演示.csv',csv(rows));log('比较导出','包含PFD、比例及已配置的a/b加权响应');toast('已导出同组光谱及计算指标')}
function importReference(){modal('读取参考光谱文件',`<p class="mb">CSV格式：第一列波长nm，第二列绝对光子光谱密度；与当前光谱采用相同单位。</p><input id="referenceFile" type="file" accept=".csv"><div class="split"></div>${field('参考名称','<input id="importRefName" value="导入的参考光谱">')}<p class="sectionnote">会校验升序、非负值及有效数据范围。归一化曲线不能作为PFD绝对值来源。</p>`,action('取消','closeModal()')+action('读取','readReference()','primary'))}async function readReference(){try{let f=$('#referenceFile').files[0];if(!f)return formError('请选择CSV文件');let values=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).map(l=>l.split(',').map(Number)).filter(a=>a.length>=2&&Number.isFinite(a[0])&&Number.isFinite(a[1]));if(values.length<3||values.some((a,i)=>a[1]<0||(i&&a[0]<=values[i-1][0])))return formError('至少3个有效点，波长必须严格递增且光谱值非负。');let name=$('#importRefName').value.trim()||f.name;S.refs.push({id:'import'+Date.now(),name,values,lo:values[0][0],hi:values.at(-1)[0],unit:'μmol·m⁻²·s⁻¹·nm⁻¹',source:'导入CSV',time:ANCHOR});log('导入参考',name);closeModal();render();toast('参考光谱已读取')}catch{formError('文件格式无法读取，请检查CSV内容。')}}
function renderBands(){let body=table(['名称 / 版本','波段','当前PFD','数据条件','操作'],S.bands.map(b=>[`${esc(b.name)}<br>${tag('v'+b.v)}`,`${b.lo}–${b.hi} nm`,fmt(integrate(curve(),b.lo,b.hi),2)+' μmol·m⁻²·s⁻¹','有效原始光谱；保留定义版本',action('编辑',`bandDialog('${b.id}')`,'link')+action('趋势',`bandTrend('${b.id}')`,'link')+action('删除',`deleteBand('${b.id}')`,'link')]));return panel('自定义波段',body+'<p class="sectionnote">仅在设备有效范围内计算；演示有效范围350–1050nm。重叠波段允许保留；编辑产生新版本，历史定义不被覆盖。</p>',action('创建波段','bandDialog()','primary'))+panel('定义变更记录',table(['波段','版本','区间','保存方式'],S.bandArchive.map(b=>[esc(b.name),'v'+b.v,`${b.lo}–${b.hi} nm`,'原定义只读保留'])))}function bandDialog(id){let b=S.bands.find(x=>x.id===id)||{name:'自定义波段',lo:600,hi:700};modal(id?'编辑波段 · 保存为新版本':'创建自定义波段',`<div class="formgrid">${field('波段名称',`<input id="bandName" maxlength="30" value="${esc(b.name)}">`)}<div></div>${field('起始波长（nm）',`<input id="bandLo" type="number" min="350" max="1050" value="${b.lo}">`)}${field('结束波长（nm）',`<input id="bandHi" type="number" min="350" max="1050" value="${b.hi}">`)}</div><p class="sectionnote">演示量程350–1050nm；实际有效量程待设备确认。</p>`,action('取消','closeModal()')+action('保存',`saveBand('${id||''}')`,'primary'))}function saveBand(id){let name=$('#bandName').value.trim(),lo=+$('#bandLo').value,hi=+$('#bandHi').value;if(!name||!Number.isFinite(lo)||!Number.isFinite(hi)||lo<350||hi>1050||lo>=hi)return formError('请输入名称，且350 ≤ 起始波长 < 结束波长 ≤ 1050。');let old=S.bands.find(x=>x.id===id),overlap=S.bands.some(x=>x.id!==id&&lo<x.hi&&hi>x.lo);if(old){S.bandArchive.push(copy(old));Object.assign(old,{name,lo,hi,v:old.v+1})}else S.bands.push({id:'band'+Date.now(),name,lo,hi,v:1});log('波段配置',`${name} ${lo}–${hi}nm`);closeModal();render();toast(overlap?'已保存；与已有波段存在重叠，保留各自定义。':'波段定义已保存')}function deleteBand(id){let b=S.bands.find(x=>x.id===id);confirmAction('删除波段',`删除“${esc(b.name)}”的当前定义？历史版本与已记录结果仍保留。`,()=>{S.bandArchive.push(copy(b));S.bands=S.bands.filter(x=>x.id!==id);log('波段删除',b.name);render()})}function bandTrend(id){let b=S.bands.find(x=>x.id===id),snapshots=Array.from({length:12},(_,i)=>{let c=copy(curve('history1'));c.values=c.values.map(p=>[p[0],p[1]*(.9+.15*Math.sin(i*.4))]);return{t:ANCHOR-(11-i)*1800000,c}});modal('自定义波段趋势',`<p class="mb">${esc(b.name)} v${b.v} · ${b.lo}–${b.hi}nm</p>${chart('bandTrend',[{name:b.name,unit:'μmol·m⁻²·s⁻¹',values:snapshots.map(x=>integrate(x.c,b.lo,b.hi))}],snapshots.map(x=>zoned(x.t)),{shared:true})}<p class="sectionnote">这里使用12份演示原始光谱快照。正式软件无有效原始光谱的时段应显示缺失，不由PPFD推算。</p>`,action('PNG',"exportPNG('bandTrend')")+action('关闭','closeModal()'),true);bindCharts()}
function renderWeights(){let w=S.weights,cs=curveIds.map(curve),base=w?weighted(curve(refId)):null;return weightVisual()+banner('叶绿素a/b参考加权响应来自光谱积分，不是叶绿素含量。请先配置参考权重；未配置时不显示计算值。','info')+panel('参考权重配置',w?kv({'权重来源':esc(w.source),'版本':esc(w.version),'归一化方式':esc(w.normalization),'结果单位':esc(w.unit),'有效区间':w.points[0][0]+'–'+w.points.at(-1)[0]+' nm','状态':tag(w.demo?'示例权重，非最终算法':'已载入自定义权重',w.demo?'orange':'blue')}):'<div class="empty"><h2>尚未配置有效参考权重</h2>请导入权重文件，或加载示例权重以体验计算与比较。</div>',action('导入权重CSV','weightDialog()','primary')+action('加载示例权重','loadDemoWeights()')+(w?action('移除权重',"S.weights=null;log('权重配置','清除当前权重');render()",'danger'):''))+panel('与当前光谱对比对象一致',table(['光谱','a加权响应','b加权响应','a相对参考差值','b相对参考差值','单位'],cs.map(c=>{let v=weighted(c);return[esc(c.name),fmt(v?.a,2),fmt(v?.b,2),v&&base?fmt(v.a-base.a,2):'—',v&&base?fmt(v.b-base.b,2):'—',esc(w?.unit||'未配置')]}))+'<p class="sectionnote">比较对象及参考曲线沿用“多光谱比较”的选择；导出时一并包含响应值、差值和权重版本。</p>',action('选择光谱',"navigate('spectrum/compare')",'small')+action('导出比较数据','exportCompare()','small primary'))}

function weightVisual(){let w=S.weights;if(!w)return '';let c=curve(),v=weighted(c),make=(key,name)=>({id:'weight-'+key,name,unit:'相对响应',values:c.values.map(([x])=>{let i=w.points.findIndex(p=>p[0]>=x);if(x<w.points[0][0]||x>w.points.at(-1)[0]||i<0)return[x,null];if(i===0)return[x,w.points[0][key]];let a=w.points[i-1],b=w.points[i];return[x,a[key]+(b[key]-a[key])*(x-a[0])/(b[0]-a[0])];})});return `<div class="spectrum-stage">${panel('光谱与a/b参考权重',spectrumChart('weightVisual',[c,make(1,'a参考权重'),make(2,'b参考权重')],true)+`<p class="sectionnote">仅用于形状对照：每条曲线分别按峰值归一化。下方响应值使用绝对光谱与已配置权重计算，不代表叶绿素含量。</p>`,action('导出图表',"exportPNG('weightVisual')",'small'))}</div><div class="grid cards weight-stats">${[['a加权响应',fmt(v?.a,2),esc(w.unit)],['b加权响应',fmt(v?.b,2),esc(w.unit)],['权重版本',esc(w.version),esc(w.demo?'示例权重':'已配置权重')],['当前光谱',esc(c.name),'350–1050 nm']].map(([a,b,u])=>`<article class="metric"><div class="label">${a}</div><strong>${b}</strong><div class="foot">${u}</div></article>`).join('')}</div>`;}

function weighted(c){let w=S.weights;if(!w)return null;let lo=w.points[0][0],hi=w.points.at(-1)[0];if(lo<c.lo||hi>c.hi)return null;let interp=(x,k)=>{let i=w.points.findIndex(p=>p[0]>=x);if(i===0)return w.points[0][k];if(i<0)return w.points.at(-1)[k];let a=w.points[i-1],b=w.points[i];return a[k]+(b[k]-a[k])*(x-a[0])/(b[0]-a[0])};return{a:integrate(c,lo,hi,x=>interp(x,1)),b:integrate(c,lo,hi,x=>interp(x,2))}}function loadDemoWeights(){S.weights={source:'UI占位示例权重（非权威参考）',version:'demo-1',unit:'a.u.（演示）',normalization:'各权重峰值归一化',demo:true,points:Array.from({length:81},(_,i)=>{let w=380+i*5;return[w,Math.exp(-1*(((w-440)/27)**2))+.7*Math.exp(-1*(((w-665)/20)**2)),Math.exp(-1*(((w-460)/28)**2))+.65*Math.exp(-1*(((w-645)/23)**2))]})};log('权重配置','载入示例权重 demo-1');render()}function weightDialog(){modal('导入a/b参考权重',`<p class="mb">CSV三列：波长nm、a权重、b权重；波长升序，权重为非负数。</p><input id="weightFile" type="file" accept=".csv"><div class="split"></div><div class="formgrid">${field('来源','<input id="weightSource" placeholder="填写论文、数据集或自定义来源">')}${field('版本','<input id="weightVersion" placeholder="例如 v1.0">')}${field('结果单位','<input id="weightUnit" placeholder="按已确认算法填写">')}${field('归一化说明','<input id="weightNorm" placeholder="例如原始权重，不归一化">')}</div>`,action('取消','closeModal()')+action('读取并保存','readWeights()','primary'))}async function readWeights(){try{let file=$('#weightFile').files[0],source=$('#weightSource').value.trim(),version=$('#weightVersion').value.trim(),unitVal=$('#weightUnit').value.trim(),normalization=$('#weightNorm').value.trim();if(!file||!source||!version||!unitVal||!normalization)return formError('请选择文件并填写来源、版本、单位和归一化说明。');let points=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/).map(l=>l.split(',').map(Number)).filter(a=>a.length===3&&a.every(Number.isFinite));if(points.length<3||points.some((p,i)=>p[1]<0||p[2]<0||(i&&p[0]<=points[i-1][0])))return formError('权重数据无效：至少3点，波长严格递增且权重非负。');S.weights={source,version,unit:unitVal,normalization,points,demo:false};log('权重配置',source+' '+version);closeModal();render()}catch{formError('CSV无法解析，请检查文件格式。')}}

function renderPeriods(){let t=activeTask();return (t?banner(`当前设备有活动任务 ${esc(t.id)}。采样配置由任务管理，结束或取消后恢复。`,'',action('查看任务',"navigate('tasks')",'small')):'')+panel('周期设置',`<div class="formgrid">${field('环境记录周期（秒）',`<input id="envPeriod" type="number" min="1" max="86400" value="${S.settings.env}" ${t?'disabled':''}>`,'控制环境数据写入间隔；允许范围由设备确认。')}${field('界面刷新周期（秒）',`<input id="uiPeriod" type="number" min="1" max="60" value="${S.settings.refresh}">`,'仅影响界面读取频率，不替代采样周期。')}${field('完整光谱采集周期（秒）',`<input id="specPeriod" type="number" min="1" max="86400" value="${S.settings.spectrum}" ${t||!lightDevice()?'disabled':''}>`,lightDevice()?'暂按0.5小时＝1800秒，口径及PPFD独立采样能力未配置。':'X300不支持光谱采集。')}${field('场景预设',`<select id="periodPreset" onchange="applyPreset(this.value)" ${t?'disabled':''}>${selectOptions(['自定义','默认0.5小时','植物工厂每天1次','温室每15分钟1次'],S.settings.preset)}</select>`)}${field('每天一次执行时刻',`<input id="dailyTime" type="time" value="${S.settings.once}">`,'按统计时区执行；仅每天一次预设使用。')}</div><br>${action('保存并回读','savePeriods()','primary')} <span class="muted">${S.scenario==='failure'?'当前演示场景将模拟下发失败':'最近回读：与当前设置一致（演示）'}</span>`)+panel('周期执行状态',table(['项目','生效值','状态','下一次执行','预计占用'],[['环境记录',S.settings.env+'s',tag(S.recording?'执行中':'已暂停',S.recording?'green':''),zoned(ANCHOR+S.settings.env*1000),'约1.8 MB/天（演示）'],['界面刷新',S.settings.refresh+'s',tag(usable()?'正常':'等待连接',usable()?'green':'orange'),zoned(ANCHOR+S.settings.refresh*1000),'不写入历史'],['完整光谱',lightDevice()?S.settings.spectrum+'s':'不支持',tag(lightDevice()?'按计划采集':'无光谱模块'),lightDevice()?zoned(ANCHOR+S.settings.spectrum*1000):'—','约0.3 MB/天（演示）']]))}function applyPreset(v){let map={'默认0.5小时':1800,'植物工厂每天1次':86400,'温室每15分钟1次':900};if(map[v])$('#specPeriod').value=map[v]}function savePeriods(){let env=+$('#envPeriod').value,ui=+$('#uiPeriod').value,spec=+$('#specPeriod').value,preset=$('#periodPreset').value,once=$('#dailyTime').value;if(env<1||env>86400||ui<1||ui>60||spec<1||spec>86400)return toast('请检查周期范围：环境/光谱1–86400秒，界面1–60秒；均为原型演示范围。');if(activeTask())return toast('活动任务占用采样配置，请先结束或取消任务');if(!usable())return toast('设备离线，未下发配置');if(S.scenario==='failure'){log('周期配置','下发失败，保留原设置','失败');return toast('下发超时：原设置保留，界面未显示为已生效。')}let before=copy(S.settings);Object.assign(S.settings,{env,refresh:ui,spectrum:spec,preset,once});log('周期配置','下发并回读一致','成功',JSON.stringify(before),JSON.stringify(S.settings));render();toast('配置已保存；演示回读值一致')}
function renderTargets(){let keys=['temp','rh','co2','pressure','vpd','margin',...(lightDevice()?['ppfd','dli']:[])];return panel('目标上下限',`<p class="muted mb">以下为目标，用于界面和统计审阅，可自行调整。露点风险以空气露点裕量判断。</p><div class="tablewrap"><table><thead><tr><th>参数</th><th>下限</th><th>上限</th><th>单位</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${META[k][0]}</td><td><input id="targetLow-${k}" type="number" step="any" value="${S.targets[k]?.[0]==null?'':displayVal(k,S.targets[k][0])}" placeholder="不限"></td><td><input id="targetHigh-${k}" type="number" step="any" value="${S.targets[k]?.[1]==null?'':displayVal(k,S.targets[k][1])}" placeholder="不限"></td><td>${unit(k)}</td></tr>`).join('')}</tbody></table></div><div class="split"></div><div class="row"><label>连续超限确认时间 <input id="debounce" type="number" min="0" value="${S.settings.debounce??60}"> 秒</label><span class="muted">防止阈值附近反复触发；正式时间规则由双方确认。</span></div><br>${action('保存目标范围','saveTargets()','primary')}`)}function inverseVal(k,n){if(['temp','dew'].includes(k)&&S.settings.temp==='F')return(n-32)/1.8;if(k==='margin'&&S.settings.temp==='F')return n/1.8;if(k==='pressure'&&S.settings.pressure==='kPa')return n*10;return n}function saveTargets(){let next=copy(S.targets);for(let k of ['temp','rh','co2','pressure','vpd','margin',...(lightDevice()?['ppfd','dli']:[])]){let a=$('#targetLow-'+k).value,b=$('#targetHigh-'+k).value;a=a===''?null:inverseVal(k,+a);b=b===''?null:inverseVal(k,+b);if(a!=null&&b!=null&&a>=b)return toast(META[k][0]+'：下限必须小于上限');if(k==='rh'&&((a!=null&&(a<0||a>100))||(b!=null&&(b<0||b>100))))return toast('相对湿度目标须在0–100%RH内');next[k]=[a,b]}let delay=+$('#debounce').value;if(delay<0||!Number.isFinite(delay))return toast('连续超限确认时间须为非负数');S.targets=next;S.settings.debounce=delay;log('目标配置','目标上下限及防抖时间已更新');render();toast('目标范围已保存，历史统计按当前目标重新计算')}

function renderComm(){let d=device();return panel('设备通信参数',`<div class="formgrid">${field('Modbus Slave ID',`<input id="commAddress" type="number" min="1" max="247" value="${d.address}">`,'十进制1–247，同一总线不能重复；0为广播地址。')}${field('Baud Rate',`<select id="commBaud">${selectOptions([9600,19200,38400],d.baud)}</select>`,'保存设备波特率后，PC同步切换并重新连接回读。')}${field('数据位',`<select id="commBits">${selectOptions([8],d.bits)}</select>`)}${field('校验位',`<select id="commParity">${selectOptions(['None','Even','Odd'],d.parity)}</select>`)}${field('停止位',`<select id="commStop">${selectOptions([1,2],d.stop)}</select>`)}${field('超时（ms）',`<input id="commTimeout" type="number" min="100" max="10000" value="${d.timeout||1000}">`)}</div><br>${action('读取当前参数','toast(\'演示回读完成，显示的是当前生效配置。\')')}${action('保存并重新连接','saveCommConfirm()','primary')}<p class="sectionnote">修改前二次确认；失败保留原设置。活动任务或升级期间阻止冲突修改。</p>`)+panel('Modbus TCP · 接口预留',`<div class="formgrid">${field('标准RTU/TCP网关地址',`<input value="${S.comm.tcpHost}" disabled>`)}${field('端口',`<input value="${S.comm.tcpPort}" disabled>`)}</div><p class="sectionnote">预留通信抽象和配置位置，当前原型不建立TCP连接，不开发自有网关或云端。</p>`,tag('P1 · 预留'))}function saveCommConfirm(){if(!requireEngineer())return;let d=device(),address=+$('#commAddress').value,baud=+$('#commBaud').value,bits=+$('#commBits').value,parity=$('#commParity').value,stop=+$('#commStop').value,timeout=+$('#commTimeout').value;if(!Number.isFinite(timeout)||timeout<100||timeout>10000)return toast('超时应为100–10000ms');if(!eng())return toast('当前账号无法执行此操作');if(!Number.isInteger(address)||address<1||address>247)return toast('地址必须是1–247的整数');if(S.devices.some(x=>x.id!==d.id&&x.address===address))return toast('总线上已存在该地址，请选择唯一地址');if(activeTask()||fwBusy)return toast('当前任务或升级占用配置，暂不可修改');let before=copy(d);confirmAction('确认修改设备通信参数',kv({'设备':esc(d.name),'地址':`${d.address} → ${address}`,'波特率':`${d.baud} → ${baud}`,'通信格式':`${bits} / ${parity} / ${stop}`,'读取超时':timeout+' ms'})+'<p class="sectionnote">下发后PC同步切换参数，重新连接并回读验证。</p>',()=>{if(S.scenario==='failure'||!usable()){log('通信配置','下发或重连超时','失败',JSON.stringify(before),'未改变');return toast('修改失败，原设备参数保留。')}Object.assign(d,{address,baud,bits,parity,stop,timeout});log('通信配置','下发后重连回读一致','成功',JSON.stringify(before),JSON.stringify(d));render();toast('参数修改成功；已重新连接并回读确认')})}
function renderCalibration(){let n=current();return panel('用户偏移校准',`<p class="muted mb">可校准参数、范围与恢复命令依赖固件确认。下表采用原型演示范围。</p><div class="tablewrap"><table><thead><tr><th>参数</th><th>原始值</th><th>偏移值</th><th>修正后</th><th>演示允许范围</th></tr></thead><tbody>${['temp','rh','co2'].map(k=>`<tr><td>${META[k][0]}</td><td>${fmt(n[k],1)} ${META[k][1]}</td><td><input id="cal-${k}" type="number" step="any" value="${S.cal[k]}" oninput="previewCal('${k}',this.value)"></td><td id="calPreview-${k}">${fmt(n[k]+S.cal[k],1)}</td><td>${k==='co2'?'±200 ppm':k==='rh'?'±10 %RH':'±5 °C'}</td></tr>`).join('')}</tbody></table></div><div class="split"></div><div class="row">${action('取消修改','render()')}${action('保存偏移并回读','saveCalibration()','primary')}${action('恢复工厂校准配置','restoreCalibration()','danger')}</div><p class="sectionnote">最近用户校准时间：${esc(S.calTime||'尚未设置')}。恢复仅取消用户偏移，不擦除工厂校准数据。</p>`)}function previewCal(k,v){$('#calPreview-'+k).textContent=fmt(current()[k]+Number(v),1)}function saveCalibration(){if(!requireEngineer())return;let next={temp:+$('#cal-temp').value,rh:+$('#cal-rh').value,co2:+$('#cal-co2').value};if(Object.values(next).some(v=>!Number.isFinite(v))||Math.abs(next.temp)>5||Math.abs(next.rh)>10||Math.abs(next.co2)>200)return toast('偏移值超出演示允许范围，请调整后保存。');confirmAction('确认保存用户偏移',kv(Object.fromEntries(Object.keys(next).map(k=>[META[k][0],S.cal[k]+' → '+next[k]]))),()=>{if(!usable()||S.scenario==='failure'){log('偏移校准','下发失败','失败');return toast('写入失败，原校准配置保留。')}let before=JSON.stringify(S.cal);S.cal=next;S.calTime=nowText();log('偏移校准','保存并回读一致','成功',before,JSON.stringify(next));render();toast('偏移已保存，原始值与修正值分别保留')})}function restoreCalibration(){if(!requireEngineer())return;confirmAction('恢复工厂校准配置','将所有用户偏移恢复为0；工厂校准数据不会被擦除。',()=>{if(S.scenario==='failure')return toast('恢复失败，原配置保留');S.cal={temp:0,rh:0,co2:0};S.calTime=nowText();log('校准恢复','用户偏移置0；工厂校准数据保留');render()})}
function diagText(){if(!diagLines.length)diagLines=[{t:'14:30:00.104',dir:'TX',text:'01 03 00 00 00 06 C5 C8',bad:false},{t:'14:30:00.148',dir:'RX',text:'01 03 0C 01 00 02 A0 03 D4 27 88 00 0A 12 34 …',bad:false},{t:'14:30:02.108',dir:'ERR',text:'Address 03 · Timeout 1000 ms · Retry 1/3',bad:true},{t:'14:30:02.208',dir:'ERR',text:'Address 02 · CRC mismatch · packet discarded',bad:true}];return diagLines.map(l=>`<div class="${l.bad?'bad':''}">${esc(l.t)}　[${l.dir}]　${esc(l.text)}</div>`).join('')}function renderDiagnostics(){return panel('通信质量',`<div class="grid cols3"><div class="metric"><div class="label">超时 / 重试</div><strong>3<em>/ 2 次</em></strong></div><div class="metric"><div class="label">CRC错误</div><strong>1<em>次</em></strong></div><div class="metric"><div class="label">往返耗时</div><strong>44<em>ms</em></strong></div></div><p class="sectionnote">上方计数为演示；清空报文显示不删除测量数据或历史事件。</p>`)+panel('原始收发报文 · 演示',`<div id="diagLines" class="logbox">${diagText()}</div><p class="sectionnote">报文仅用于界面审阅，不作为设备正式寄存器协议。</p>`,action(diagPaused?'继续查看':'暂停查看',"diagPaused=!diagPaused;render()",'small')+action('清空显示',"diagLines=[];$('#diagLines').innerHTML='';toast('仅清空显示，历史测量数据保留')",'small')+action('保存诊断日志','exportDiagnostics()','small primary'))}function exportDiagnostics(){if(!requireEngineer())return;download('XPAR_通信诊断_演示.txt',diagLines.map(l=>l.t+' ['+l.dir+'] '+l.text).join('\n'));log('诊断导出','原始收发与错误日志')}
function renderFirmware(){return panel('本地固件升级',`<div class="grid equal2"><div>${kv({'目标设备':device().model+' / '+device().sn,'当前固件':'1.0.6-demo','连接方式':S.comm.com+' / RS485','升级状态':fwBusy?tag('升级中','orange'):tag('待选择固件')})}</div><div class="filebox"><p>选择与设备型号匹配的固件文件</p><br><input id="firmwareFile" type="file" accept=".bin,.hex" onchange="chooseFirmware(this.files[0])"><br><br>${action('使用演示固件','firmware={name:device().model+\'_v1.1.0_demo.bin\',model:device().model,version:\'1.1.0-demo\',demo:true};render()','small')}</div></div><div class="split"></div><div id="firmwareInfo">${firmware?`<b>${esc(firmware.name)}</b><p class="muted">型号：${esc(firmware.model||'未识别')} / 目标版本：${esc(firmware.version||'待读取')}</p>`:'<span class="muted">尚未选择固件</span>'}</div><br><div class="progress"><span id="firmwareProgress" style="width:0%"></span></div><p id="firmwareStatus" class="sectionnote">升级前核对型号和版本；正式实现需校验固件签名及完整性。</p><br>${action('开始升级','upgradeFirmware()','primary')}<p class="sectionnote">原型不向设备写入文件；演示升级期间阻止配置冲突。失败时保留恢复指引。</p>`)}function chooseFirmware(f){if(!f)return;let model=f.name.match(/X(?:300|400)/i)?.[0]?.toUpperCase();firmware={name:f.name,model,version:'待读取',demo:false};render()}function upgradeFirmware(){if(!requireEngineer())return;if(!firmware)return toast('请先选择固件');if(firmware.model!==device().model)return toast('固件型号不匹配或无法识别，禁止升级。');if(activeTask())return toast('有活动任务，请先结束后再升级');if(!usable())return toast('设备离线，请检查连接');if(fwBusy)return;confirmAction('确认固件升级',`设备 ${device().model} / ${device().sn}<br>固件 ${esc(firmware.name)}<p class="sectionnote">升级期间当前设备暂停采集并锁定配置。请保持连接和供电。</p>`,()=>{fwBusy=true;let p=0;let timer=setInterval(()=>{p+=10;if($('#firmwareProgress'))$('#firmwareProgress').style.width=p+'%';if($('#firmwareStatus'))$('#firmwareStatus').textContent='演示升级进度 '+p+'%';if(S.scenario==='failure'&&p>=40){clearInterval(timer);fwBusy=false;if($('#firmwareStatus'))$('#firmwareStatus').innerHTML='<span class="badtext">传输失败。保持设备供电 → 检查串口与型号 → 重新进入升级模式并重试；若无法识别，联系工程师恢复。</span>';log('固件升级','传输中断','失败');return}if(p>=100){clearInterval(timer);fwBusy=false;log('固件升级',firmware.name+' 升级完成并重新识别');if($('#firmwareStatus'))$('#firmwareStatus').innerHTML='<span class="goodtext">升级成功（演示），已重新识别设备；版本1.1.0-demo。</span>';toast('演示固件升级流程完成')}},230)})}
let auditFilters={type:'全部操作',result:'全部结果',device:'全部设备',start:'',end:''};function filteredAudit(){return S.logs.filter(l=>(auditFilters.type==='全部操作'||l.type===auditFilters.type)&&(auditFilters.result==='全部结果'||l.result===auditFilters.result)&&(auditFilters.device==='全部设备'||l.device===auditFilters.device)&&(!auditFilters.start||l.time>=new Date(auditFilters.start).getTime())&&(!auditFilters.end||l.time<new Date(auditFilters.end).getTime()+86400000))}function renderAudit(){let list=filteredAudit();return panel('操作记录 · 自动覆盖两种权限',`<div class="row mb"><label>设备 <select onchange="auditFilters.device=this.value;render()">${selectOptions(['全部设备',...S.devices.map(d=>d.sn)],auditFilters.device)}</select></label><label>操作 <select onchange="auditFilters.type=this.value;render()">${selectOptions(['全部操作',...new Set(S.logs.map(l=>l.type))],auditFilters.type)}</select></label><label>结果 <select onchange="auditFilters.result=this.value;render()">${selectOptions(['全部结果','成功','失败'],auditFilters.result)}</select></label><label>开始 <input type="date" value="${auditFilters.start}" onchange="auditFilters.start=this.value;render()"></label><label>结束 <input type="date" value="${auditFilters.end}" onchange="auditFilters.end=this.value;render()"></label><span class="spacer"></span>${action('导出CSV','exportAudit()','small')}</div>`+table(['操作时间','设备 / 操作者','类型 / 权限','内容','结果','详情'],list.map(l=>[new Date(l.time).toLocaleString(),`${esc(l.device)}<br><small>${l.operator} / ${l.terminal}</small>`,`${esc(l.type)}<br><small>${l.role}</small>`,esc(l.details),tag(l.result,l.result==='成功'?'green':'red'),action('查看',`auditDetail(${S.logs.indexOf(l)})`,'link')]))+`<div class="split"></div><div class="row"><label>记录保留天数 <input type="number" id="retentionDays" min="1" max="3650" value="${S.settings.retention}"></label>${action('保存保留策略','saveRetention()','small')}<span class="muted">与测量数据保留独立；不记录密码。</span></div>`)}function auditDetail(i){if(!requireEngineer())return;let l=S.logs[i];modal('操作详情',kv({'设备':esc(l.device),'操作者 / 终端':esc(l.operator+' / '+l.terminal),'访问权限':esc(l.role),'操作类型':esc(l.type),'修改前':esc(l.before||'—'),'修改后':esc(l.after||l.details),'结果':esc(l.result),'关联任务ID':esc(l.task)}),action('关闭','closeModal()'))}function exportAudit(){if(!requireEngineer())return;download('XPAR_操作记录_演示.csv',csv([['时间','设备','操作者','终端','权限','类型','修改前','修改后','内容','结果','任务ID'],...filteredAudit().map(l=>[new Date(l.time).toISOString(),l.device,l.operator,l.terminal,l.role,l.type,l.before,l.after,l.details,l.result,l.task])]));log('操作记录导出','按当前筛选导出')}function saveRetention(){if(!requireEngineer())return;let n=+$('#retentionDays').value;if(!Number.isInteger(n)||n<1||n>3650)return toast('请输入1–3650天');S.settings.retention=n;log('记录保留策略',n+'天');toast('策略已保存，不影响测量数据')}
function renderBackup(){return head('数据备份','本地设备配置、目标范围和历史记录')+`<div class="grid equal2">${panel('创建备份',kv({'备份内容':'设备列表、配置、目标、记录、波段版本、参考光谱及任务快照','测量记录':S.records.length+'条','设备':S.devices.length+'台','最近备份':S.lastBackup?esc(S.lastBackup):'尚未备份','保存方式':'保存为本地备份文件'})+`<br>${action('导出完整备份','backupNow()','primary')}`)}${panel('从文件恢复',`<div class="filebox"><p>选择之前导出的XPAR备份文件</p><br><input type="file" id="backupFile" accept=".json"></div><p class="sectionnote">先校验格式、版本与内容，预览覆盖范围后再确认。失败时现有数据保持不变。</p><br>${action('校验并预览','previewRestore()','primary')}`)}</div>`+panel('恢复规则',`<ul><li>恢复前显示文件时间、设备数量、记录数量及覆盖范围。</li><li>备份不包含密码；恢复不会更换当前登录账号。</li><li>当前有活动任务时禁止覆盖恢复，防止丢失任务原配置。</li><li>包含设备维护设置的备份，请联系服务人员恢复。</li></ul>`)}function backupNow(){S.lastBackup=nowText();let payload={schema:'XPAR-UI-1',created:new Date().toISOString(),state:copy(S)};payload.state.role='User Access';download('XPAR_本地备份_'+DEMODAY+'.json',JSON.stringify(payload,null,2),'application/json');log('数据库备份',S.records.length+'条记录');render();toast('备份文件已生成')}let pendingRestore=null;async function previewRestore(){try{if(S.tasks.some(t=>['执行中','待开始','恢复失败'].includes(t.state)))return toast('请先结束活动任务并确认原配置恢复');let f=$('#backupFile').files[0];if(!f)return toast('请选择备份文件');if(f.size>12000000)return toast('备份文件过大；原型仅接受12MB以内文件');let b=JSON.parse(await f.text()),s=b.state;if(b.schema!=='XPAR-UI-1'||s?.schema!=='XPAR-UI-1'||!Array.isArray(s.devices)||!s.devices.length||!Array.isArray(s.records)||!s.settings||!s.targets||s.devices.some(d=>!Number.isInteger(d.address)||d.address<1||d.address>247)||new Set(s.devices.map(d=>d.address)).size!==s.devices.length)return toast('备份版本或结构不兼容，未修改当前数据');if(!eng()&&(JSON.stringify(s.cal)!==JSON.stringify(S.cal)||JSON.stringify(s.devices.map(d=>[d.address,d.baud,d.parity,d.stop]))!==JSON.stringify(S.devices.map(d=>[d.address,d.baud,d.parity,d.stop]))))return toast('备份中的设备维护设置与当前不同，请联系服务人员恢复');pendingRestore=s;confirmAction('确认备份恢复',kv({'备份创建':esc(b.created),'设备数量':s.devices.length+'台','历史记录':s.records.length+'条','覆盖范围':'设备配置、目标、历史记录、波段和本端偏好','当前账号':esc(S.account||'未登录')})+'<p class="sectionnote">确认后覆盖本地配置和记录；恢复前会自动保存当前数据备份。</p>',()=>{let before=copy(S);try{download('XPAR_恢复前快照.json',JSON.stringify({schema:'XPAR-UI-1',created:new Date().toISOString(),state:before}),'application/json');let role=S.role,account=S.account;S={...initialState(),...copy(pendingRestore),role,account,scenario:'normal'};persist();log('数据库恢复','恢复完成，记录及配置已核对');render();toast('备份恢复完成')}catch{S=before;persist();toast('恢复失败，现有数据保留')}})}catch{toast('文件解析失败，当前配置与记录未改变')}}
function renderHelp(){
  let t=tab||'guide';if(t==='coverage')t='guide';
  let out=head('帮助与支持','查找操作方法、参数说明和常见问题')+tabs([['guide','快速上手'],['parameters','参数说明'],['about','关于软件']],t);
  if(t==='parameters')return out+panel('参数说明',`<input class="wideinput mb" id="parameterSearch" placeholder="搜索温度、湿度、VPD、光谱…" oninput="filterParameters()"><div id="parameterTable">${parameterTable(PARAMS)}</div><p class="sectionnote">空气VPD和露点根据空气温度与相对湿度计算；DLI与积温根据有效记录累计。具体可用参数以设备型号为准。</p>`);
  if(t==='about')return out+renderAbout();
  return out+panel('开始使用',`<div class="grid cols3">${[['01','连接设备','选择串口并连接，扫描设备后设置名称和房间。','devices'],['02','查看监测数据','选择设备，查看环境读数、光照和历史趋势。','overview'],['03','保存与分析','查询历史记录、分析光照积累，导出数据或报告。','history']].map(([n,h,b,r])=>`<div><b class="muted">${n}</b><h2 style="margin:8px 0">${h}</h2><p class="muted">${b}</p><br>${action('前往',`navigate('${r}')`,'small')}</div>`).join('')}</div>`)
  +panel('常见问题',`<details open><summary>如何连接设备？</summary><p>打开“设备管理”，选择USB-RS485适配器对应的COM串口并连接，再扫描设备。设备名称和房间可修改，SN用于识别设备。</p></details><details><summary>设备离线或读数显示“—”怎么办？</summary><p>检查供电、USB连接和RS485接线，再重新连接。离线时保留最后有效读数；缺失数据和不可用的计算结果显示“—”。</p></details><details><summary>如何记录和导出数据？</summary><p>工具栏可开始或暂停记录。打开“历史记录”选择日期和参数；打开“导出与报告”选择设备、时段及参数，可保存CSV、Excel或PNG图表。暂停记录不会删除历史数据。</p></details><details><summary>如何设置目标范围？</summary><p>在“软件设置 → 目标范围”设置温湿度、CO₂、光照等目标。超限后在实时页面提示，并在“告警记录”保留明细。</p></details><details><summary>空气VPD、露点和DLI表示什么？</summary><p>空气VPD表示空气的水汽压亏缺。露点温度表示空气中的水汽开始凝结时的温度；空气露点裕量不直接判断叶片是否结露。DLI表示一天累计的光照量，数据缺失时同时关注记录覆盖率。</p></details><details><summary>如何比较光谱？</summary><p>选择支持光谱的设备，进入“光谱分析 → 多光谱比较”。最多可选择6条光谱，并指定一条参考光谱。归一化用于比较曲线形状，绝对PFD使用原始光谱计算。</p></details><details><summary>如何备份和恢复？</summary><p>在“数据备份”导出本地备份。恢复前会显示覆盖范围；活动任务结束后再进行恢复。请将备份文件保存在可靠的位置。</p></details><details><summary>如何更换登录账号？</summary><p>点击右上角账号名称，选择其他账号后重新登录。本演示的数据保存在当前浏览器，不会同步到其他设备。</p></details>`,action('打印帮助','window.print()','small'));
}
function requirementsTable(rs){return table(['原表行','模块 / 功能','优先级','权限','功能说明','页面'],visibleRequirements(rs).map(r=>[r.row,`<b>${esc(r.name)}</b><br><small>${esc(r.module)}</small>`,priority(r.priority),r.role==='Engineer Access'?tag('Engineer Access'):tag('User Access','blue'),`<div style="min-width:250px">${esc(r.desc)}</div>${r.note?`<details><summary>补充说明</summary><p>${esc(r.note)}</p></details>`:''}`,action('查看页面',`navigate('${r.route}')`,'small')]))}function filterRequirements(){let k=$('#reqSearch').value.toLowerCase(),p=$('#reqPriority').value,r=$('#reqRole').value;$('#requirementTable').innerHTML=requirementsTable(REQUIREMENTS.filter(x=>(x.name+x.module+x.desc).toLowerCase().includes(k)&&(p==='全部优先级'||p===x.priority)&&(r==='全部权限'||r===x.role)))}function parameterTable(ps){return table(['序号','参数项','单位','表现形式'],ps.map(p=>[PARAMS.indexOf(p)+1,esc(p[0]),esc(p[1]),esc(p[2])]),'paramtable')}function filterParameters(){let key=$('#parameterSearch').value.toLowerCase();$('#parameterTable').innerHTML=parameterTable(PARAMS.filter(p=>p.join(' ').toLowerCase().includes(key)))}function renderAbout(){return panel('XPAR Sensor Utility',kv({'软件版本':'0.4.0 · 演示版','适用场景':'植物生长环境与光照监测','设备模式':'模拟设备','数据保存':'当前浏览器本地保存','当前账号':esc(S.account||'未登录')})+`<p class="sectionnote">此演示用于体验软件界面；设备读数、连接、校准和升级均为模拟操作。</p><br>${action('查看操作帮助',"navigate('help/guide')",'primary')}`)+panel('本地数据',`<p class="muted mb">可先导出备份，再恢复初始示例数据。恢复后会清除当前浏览器中的自定义配置和记录。</p>${action('导出备份','backupNow()')}${action('恢复示例数据','resetDemo()','danger')}`)}
function checkUpdates(){let el=$('#updateState');el.textContent='正在检查演示更新服务…';setTimeout(()=>{if(el.isConnected)el.innerHTML=S.scenario==='failure'?'<span class="badtext">检查失败，可继续使用当前版本。</span>':'演示：当前为最新原型0.4.0；正式软件更新服务尚未接入。'},600)}function resetDemo(){confirmAction('恢复示例数据','将恢复示例设备、配置和记录。请先备份需要保留的数据。',()=>{let account=S.account,role=S.role;S=initialState();S.account=account;S.role=role;persist();navigate('overview');toast('示例数据已恢复')})}

// Keep recorded per-day DLI aligned with sample timestamps, never filling a gap with zero.
function refreshRecordedDLI(){let running={};for(let r of S.records){let key=r.id+'|'+dayOf(r.t);if(r.ppfd==null){r.dli=null;continue}let sec=Math.max(0,Math.min(1800,(ANCHOR-r.t)/1000));running[key]=(running[key]||0)+r.ppfd*sec/1e6;r.dli=running[key]}}

let openViews=['overview'];
function renderDesktopSidebar(){return '<div class="pane-title">功能导航</div><div class="nav-tree">'+NAV.filter(n=>n.length===1||canAccessPage(n[0])).map(n=>n.length===1?`<div class="navgroup">${n[0]}</div>`:`<button class="navbtn ${page===n[0]?'on':''}" onclick="navigate('${n[0]}')"><span class="navicon">${n[2]}</span>${n[1]}</button>`).join('')+'</div><div class="pane-title">已连接总线 · '+esc(S.comm.com)+'</div><div class="device-tree"><div class="tree-root">▾ RS485 / Modbus RTU</div>'+S.devices.map(d=>`<button class="tree-device ${d.id===S.selected?'selected':''}" onclick="selectWorkspaceDevice(${d.id})"><span class="tree-dot ${usable(d)?'':'off'}"></span><span>${esc(d.name)}<small>${d.model} · 地址 ${d.address} · ${usable(d)?'在线':'离线'}</small></span></button>`).join('')+'</div>'}
function selectWorkspaceDevice(id){S.selected=id;persist();render()}
function renderDesktopChrome(){syncRoleWorkspace();let name=NAV.find(n=>n[0]===page)?.[1]||'实时监测';document.getElementById('windowTitle').textContent='XPAR Sensor Utility — '+name;if(!openViews.includes(page))openViews.push(page);document.getElementById('workspaceTabs').innerHTML=openViews.map(id=>{let item=NAV.find(n=>n[0]===id);return `<div class="document-tab ${id===page?'active':''}"><button class="document-name" onclick="navigate('${id}')">${esc(item?.[1]||id)}</button>${id!=='overview'?`<button class="document-close" aria-label="关闭${esc(item?.[1]||id)}页" onclick="closeWorkspaceView('${id}')">×</button>`:''}</div>`}).join('');let record=document.getElementById('toolbarRecord');record.className='toolbutton '+(S.recording?'record-on':'');record.innerHTML='<span class="tool-icon">'+(S.recording?'■':'●')+'</span><span>'+(S.recording?'暂停记录':'开始记录')+'</span>';}
function closeWorkspaceView(id){openViews=openViews.filter(v=>v!==id);if(page===id)navigate(openViews.at(-1)||'overview');else renderDesktopChrome()}
const DESKTOP_MENUS={file:[['数据导出…',"navigate('export')",'Ctrl+E'],['监测报告…',"navigate('export/report')",''],['-'],['数据备份…',"navigate('backup')",''],['切换账号…','login()','']],device:[['连接设备…','connectDialog()','Ctrl+O'],['扫描RS485设备…','scanDevices()',''],['当前设备属性…','deviceInfo(S.selected)',''],['-'],['开始 / 暂停记录','toggleRecording()','Ctrl+Shift+L'],['采集光谱快照','captureSpectrum()','']],view:[['实时监测',"navigate('overview')",''],['历史记录',"navigate('history')",''],['光谱比较',"navigate('spectrum/compare')",''],['数据分析',"navigate('analysis')",''],['告警记录',"navigate('events')",'']],tools:[['软件设置…',"navigate('settings')",''],['采集任务…',"navigate('tasks')",''],['设备维护…',"navigate('engineering')",''],['-'],['自定义显示…','cardChooser()','']],help:[['使用说明',"navigate('help')",'F1'],['功能对照',"navigate('help/coverage')",''],['参数说明',"navigate('help/parameters')",''],['-'],['关于 XPAR Sensor Utility',"navigate('help/about')",'']]};
function closeDesktopMenu(){document.getElementById('desktopMenu')?.remove();document.querySelectorAll('.menubar .menu-open').forEach(el=>el.classList.remove('menu-open'))}
function visibleDesktopEntries(name){return DESKTOP_MENUS[name].map((entry,i)=>({entry,i})).filter(({entry})=>entry[1]!=="navigate('help/coverage')"&&(eng()||entry[1]!=="navigate('engineering')"))}function desktopMenu(name,button){let same=document.getElementById('desktopMenu')?.dataset.menu===name;closeDesktopMenu();if(same)return;button.classList.add('menu-open');let r=button.getBoundingClientRect(),menu=document.createElement('div');menu.id='desktopMenu';menu.dataset.menu=name;menu.className='desktop-popup';menu.setAttribute('role','menu');menu.style.left=r.left+'px';menu.style.top=r.bottom+'px';menu.innerHTML=visibleDesktopEntries(name).map(({entry,i})=>entry[0]==='-'?'<div class="menu-rule"></div>':`<button role="menuitem" onclick="runDesktopCommand('${name}',${i})"><span>${esc(entry[0])}</span><kbd>${esc(entry[2])}</kbd></button>`).join('');document.body.append(menu)}
function runDesktopCommand(name,i){let entry=visibleDesktopEntries(name).find(item=>item.i===i)?.entry;closeDesktopMenu();if(!entry)return;let commands={"navigate('export')":()=>navigate('export'),"navigate('export/report')":()=>navigate('export/report'),"navigate('backup')":()=>navigate('backup'),'login()':()=>login(),'connectDialog()':()=>connectDialog(),'scanDevices()':()=>scanDevices(),'deviceInfo(S.selected)':()=>deviceInfo(S.selected),'toggleRecording()':()=>toggleRecording(),'captureSpectrum()':()=>captureSpectrum(),"navigate('overview')":()=>navigate('overview'),"navigate('history')":()=>navigate('history'),"navigate('spectrum/compare')":()=>navigate('spectrum/compare'),"navigate('analysis')":()=>navigate('analysis'),"navigate('events')":()=>navigate('events'),"navigate('settings')":()=>navigate('settings'),"navigate('tasks')":()=>navigate('tasks'),"navigate('engineering')":()=>navigate('engineering'),'cardChooser()':()=>cardChooser(),"navigate('help')":()=>navigate('help'),"navigate('help/coverage')":()=>navigate('help/coverage'),"navigate('help/parameters')":()=>navigate('help/parameters'),"navigate('help/about')":()=>navigate('help/about')};commands[entry[1]]?.()}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menubar,.desktop-popup'))closeDesktopMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDesktopMenu();if(e.target.matches('input,textarea,select'))return;if(e.ctrlKey&&e.key.toLowerCase()==='o'){e.preventDefault();connectDialog()}if(e.ctrlKey&&e.key.toLowerCase()==='e'){e.preventDefault();navigate('export')}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='l'){e.preventDefault();toggleRecording()}if(e.key==='F1'){e.preventDefault();navigate('help')}});

function boot(){if(!S.logs.length)S.logs.push({time:Date.now()-3600000,device:'DEMO-X400-001',role:'User Access',type:'周期配置',details:'环境周期60s，保存并回读一致',result:'成功',before:'120s',after:'60s',task:'—',operator:'本机演示操作者',terminal:'PC-DEMO'});refreshRecordedDLI();let route=location.hash.slice(1).split('/');page=route[0]||'overview';tab=route[1]||'';render();login();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{tick++;let changed=false;for(let t of S.tasks){if(t.state==='待开始'&&Date.now()>=t.start){t.state='执行中';if(t.device===S.selected){S.settings.env=t.env;S.settings.spectrum=t.spec}log('任务启动',t.id);changed=true}if(t.state==='执行中'&&Date.now()>=t.end){finishTask(t.id,'已完成');changed=true}}if(page==='tasks'&&!$('#modal').innerHTML&&S.tasks.some(t=>['执行中','待开始'].includes(t.state)))render();if(tick%Math.max(1,S.settings.env)===0&&S.recording&&usable()&&S.scenario!=='disk'){S.recordCount++;S.lastWrite=ANCHOR;persist()}footer();if(tick%Math.max(1,S.settings.refresh)===0&&page==='overview'&&!$('#modal').innerHTML){updateOverviewValues()}if(page==='engineering'&&tab==='diag'&&!diagPaused&&eng()&&$('#diagLines')&&tick%3===0){diagLines.push({t:'14:30:'+String(tick%60).padStart(2,'0')+'.125',dir:'RX',text:'演示轮询 Address '+device().address+' · Response OK · 44 ms',bad:false});diagLines=diagLines.slice(-100);$('#diagLines').innerHTML=diagText()}},1000);
boot();
